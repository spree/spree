      - bearer_auth: []
      description: Rewrites one of this seller's policies.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: policy updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Policy"
      requestBody:
        content:
          application/json:
            schema:
              type: object
