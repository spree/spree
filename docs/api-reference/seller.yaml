            application/json:
              example:
                id: ful_UkLWZg9DAJ
                number: R1001-F1
                status: fulfilled
                tracking: TRACK-1
                tracking_url:
                tracking_carrier:
                tracking_status:
                fulfilled_at: '2026-01-15T12:00:00.000Z'
                created_at: '2026-01-15T12:00:00.000Z'
                updated_at: '2026-01-15T12:00:00.000Z'
                fulfillment_type: shipping
                delivery_method_name: UPS Ground
                stock_location_name: Mirta Herman
                fulfillment_items:
