  "/api/v3/seller/delivery_methods":
    get:
      summary: List delivery methods
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: |
        How this seller's goods can ship: the methods they created themselves,
        plus any the marketplace shares with its sellers.

        A shared marketplace method comes back with `editable: false` — it is
        listed so the seller can see what already ships their goods, and every
        write against it is a 404.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: delivery methods listed
          content:
            application/json:
              example:
                data:
                - id: dm_UkLWZg9DAJ
                  name: My courier
                  code: UPS_GROUND
                  estimated_transit_business_days_min:
                  estimated_transit_business_days_max:
                  digital: false
                  pickup: false
                  pickup_point: false
                  admin_name:
                  storefront_visible: true
                  tracking_url:
                  created_at: '2026-01-15T12:00:00.000Z'
                  updated_at: '2026-01-15T12:00:00.000Z'
                  rules: []
                  editable: true
                  delivery_profile_id: fp_UkLWZg9DAJ
                  delivery_zone_id:
                  calculator_type: Spree::Calculator::Shipping::FlatRate
                  calculator_preferences:
                    amounts: {}
                    amount: '10.0'
                    currency: USD
                - id: dm_gbHJdmfrXB
                  name: Marketplace post
                  code: UPS_GROUND
                  estimated_transit_business_days_min:
                  estimated_transit_business_days_max:
                  digital: false
                  pickup: false
                  pickup_point: false
                  admin_name:
                  storefront_visible: true
                  tracking_url:
                  created_at: '2026-01-15T12:00:00.000Z'
                  updated_at: '2026-01-15T12:00:00.000Z'
                  rules: []
                  editable: false
                  delivery_profile_id: fp_UkLWZg9DAJ
                  delivery_zone_id:
                  calculator_type: Spree::Calculator::Shipping::FlatRate
                  calculator_preferences:
                    amounts: {}
                    amount: '10.0'
                    currency: USD
                meta:
                  page: 1
                  limit: 25
                  count: 2
                  pages: 1
                  from: 1
                  to: 2
                  in: 2
                  previous:
                  next:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryMethod"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
    post:
      summary: Create a delivery method
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: |
        Adds a way for this seller to ship. The method is always the seller's
        own, whatever the payload says.

        Neither the rate provider nor the fulfillment provider is settable: a
        seller prices their own rates and enters tracking numbers by hand,
        because carrier accounts belong to the marketplace.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: delivery method created
          content:
            application/json:
              example:
                id: dm_EfhxLZ9ck8
                name: Next day
                code:
                estimated_transit_business_days_min:
                estimated_transit_business_days_max:
                digital: false
                pickup: false
                pickup_point: false
                admin_name:
                storefront_visible: true
                tracking_url:
                created_at: '2026-01-15T12:00:00.000Z'
                updated_at: '2026-01-15T12:00:00.000Z'
                rules: []
                editable: true
                delivery_profile_id: fp_gbHJdmfrXB
                delivery_zone_id:
                calculator_type: Spree::Calculator::Shipping::FlatRate
                calculator_preferences:
                  amounts: {}
                  amount: '9.99'
                  currency: USD
              schema:
                "$ref": "#/components/schemas/DeliveryMethod"
        '422':
          description: invalid request
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Name can't be blank
                  details:
                    name:
                    - can't be blank
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                admin_name:
                  type: string
                  nullable: true
                code:
                  type: string
                  nullable: true
                delivery_profile_id:
                  type: string
                  description: One of the marketplace's delivery profiles
                delivery_zone_id:
                  type: string
                  nullable: true
                  description: Narrows where the method ships
                storefront_visible:
                  type: boolean
                tracking_url:
                  type: string
                  nullable: true
                estimated_transit_business_days_min:
                  type: integer
                  nullable: true
                estimated_transit_business_days_max:
                  type: integer
                  nullable: true
                calculator_type:
                  type: string
                calculator_preferences:
                  type: object
                rules:
                  type: array
                  description: Conditions on the method, from `/delivery_methods/rule_types`
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      preferences:
                        type: object
              required:
              - name
