---
openapi: 3.0.3
info:
  title: Seller API
  contact:
    name: Spree Commerce
    url: https://spreecommerce.org
    email: hello@spreecommerce.org
  description: |
    Spree Seller API v3 - the marketplace seller panel, where a seller runs
    their own shop inside someone else's marketplace.

    This is a branch of its own, not a narrowing of the Admin API. Every
    endpoint is scoped server-side to the seller the request acts as, which
    is what makes cross-seller access impossible by construction rather
    than by rule. Sellers never call the Admin API.

    ## Authentication

    Sign in at `POST /api/v3/seller/auth/login` and send the returned JWT as
    `Authorization: Bearer <token>`. The token carries a `seller_api`
    audience — a token minted for the storefront or the back office is not
    accepted here, and vice versa.

    There is deliberately **no secret API key** for this branch: a
    credential that could act as a seller without a seller signing in is
    exactly what the separate audience exists to prevent.

    ### Choosing a seller

    A user may run more than one seller. Login returns the list; send the
    chosen seller's ID in the `X-Spree-Seller-Id` header on every
    authenticated request. The store is derived from the seller — never
    sent — so no header can widen what a seller reaches. A request that
    names no seller the caller belongs to is rejected with `403`.

    ## Response Format

    All responses are JSON. List endpoints return paginated responses with
    `data` and `meta` keys.

    ## Error Handling

    Errors return a consistent format:
    ```json
    {
      "error": {
        "code": "validation_error",
        "message": "Validation failed",
        "details": { "name": ["can't be blank"] }
      }
    }
    ```
  version: v3
paths:
  "/api/v3/seller/auth/login":
    post:
      summary: Login
      tags:
      - Authentication
      description: |
        Signs a seller in and returns a short-lived JWT access token carrying the
        `seller_api` audience. The rotatable refresh token is set in an HttpOnly
        cookie — it is not included in the response body.

        The response lists every seller this user may act for. Pick one and send
        its `id` as `X-Spree-Seller-Id` on every subsequent request; nothing else
        on this API answers until a seller is named.

        Authenticating is not on its own enough. A store's own staff share the
        same user class, so a user who runs no seller is refused — issuing a
        token would hand out an audience its holder can do nothing with.

        The `provider` field selects the authentication method. When omitted it
        defaults to `email`. Sellers and store staff read different provider
        registries, so a marketplace can require SSO for its own back office
        while still letting sellers sign in with a password.
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - email
                  default: email
                email:
                  type: string
                  format: email
                  example: seller@example.com
                password:
                  type: string
                  example: password123
              required:
              - email
              - password
  "/api/v3/seller/auth/refresh":
    post:
      summary: Refresh token
      tags:
      - Authentication
      description: |
        Exchanges the HttpOnly refresh-token cookie for a new access JWT and a
        rotated refresh cookie. No request body or Authorization header is
        required — the cookie alone authenticates the call.

        The lookup is narrowed by audience, so a refresh token minted for the
        storefront or the back office cannot be exchanged for a seller session.
        Membership is rechecked here too: a user whose last seller role was
        revoked mid-session is refused rather than renewed.
      responses:
        '200':
          description: refresh successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          description: missing or invalid refresh-token cookie
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/auth/logout":
    post:
      summary: Logout
      tags:
      - Authentication
      description: Revokes the refresh-token cookie, ending the seller session.
      responses:
        '204':
          description: logout successful
  "/api/v3/seller/auth/providers":
    get:
      summary: List authentication providers
      tags:
      - Authentication
      description: |
        The sign-in methods this marketplace offers sellers, for the login page
        to render. Unauthenticated — a login page must be able to ask before
        anyone has signed in.
      responses:
        '200':
          description: providers listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthProvidersResponse"
  "/api/v3/seller/countries":
    get:
      summary: List countries
      tags:
      - Countries
      security:
      - bearer_auth: []
      description: |
        Countries and their states, for the panel's address forms.

        Public reference data — the same list the storefront serves — so it is
        not narrowed to the markets this marketplace sells into: a seller filling
        in a billing address needs every country.

        Unpaginated. An address dropdown needs all ~250 at once.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: countries listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SellerCountry"
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 250
                    required:
                    - count
                required:
                - data
                - meta
  "/api/v3/seller/delivery_methods":
    get:
      summary: List delivery methods
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: |
        How this seller's goods can ship: the methods they created themselves,
        plus any the marketplace shares with its sellers.

        A shared marketplace method comes back with `editable: false` — it is
        listed so the seller can see what already ships their goods, and every
        write against it is a 404.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: delivery methods listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryMethod"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
    post:
      summary: Create a delivery method
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: |
        Adds a way for this seller to ship. The method is always the seller's
        own, whatever the payload says.

        Neither the rate provider nor the fulfillment provider is settable: a
        seller prices their own rates and enters tracking numbers by hand,
        because carrier accounts belong to the marketplace.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: delivery method created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeliveryMethod"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                admin_name:
                  type: string
                  nullable: true
                code:
                  type: string
                  nullable: true
                delivery_profile_id:
                  type: string
                  description: One of the marketplace's delivery profiles
                delivery_zone_id:
                  type: string
                  nullable: true
                  description: Narrows where the method ships
                storefront_visible:
                  type: boolean
                tracking_url:
                  type: string
                  nullable: true
                estimated_transit_business_days_min:
                  type: integer
                  nullable: true
                estimated_transit_business_days_max:
                  type: integer
                  nullable: true
                calculator_type:
                  type: string
                calculator_preferences:
                  type: object
                rules:
                  type: array
                  description: Conditions on the method, from `/delivery_methods/rule_types`
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      preferences:
                        type: object
              required:
              - name
  "/api/v3/seller/delivery_methods/{id}":
    parameters:
    - name: id
      in: path
      description: Delivery method ID
      required: true
      schema:
        type: string
    - name: X-Spree-Seller-Id
      in: header
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a delivery method
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      responses:
        '200':
          description: delivery method found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeliveryMethod"
    patch:
      summary: Update a delivery method
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: Only the seller's own methods can be changed — a marketplace method
        shared with sellers is read-only.
      parameters: []
      responses:
        '200':
          description: delivery method updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeliveryMethod"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                admin_name:
                  type: string
                  nullable: true
                code:
                  type: string
                  nullable: true
                delivery_profile_id:
                  type: string
                  description: One of the marketplace's delivery profiles
                delivery_zone_id:
                  type: string
                  nullable: true
                  description: Narrows where the method ships
                storefront_visible:
                  type: boolean
                tracking_url:
                  type: string
                  nullable: true
                estimated_transit_business_days_min:
                  type: integer
                  nullable: true
                estimated_transit_business_days_max:
                  type: integer
                  nullable: true
                calculator_type:
                  type: string
                calculator_preferences:
                  type: object
                rules:
                  type: array
                  description: Replaces the whole set — a rule dropped here is deleted,
                    so re-send surviving rules with their `id`.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      preferences:
                        type: object
    delete:
      summary: Retire a delivery method
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      responses:
        '204':
          description: delivery method retired
  "/api/v3/seller/delivery_methods/rule_types":
    get:
      summary: List the conditions a method can carry
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      description: The eligibility rules a seller may put on their own method, with
        the preference schema each form is rendered from.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: rule types listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        preference_schema:
                          type: array
                          items:
                            type: object
                required:
                - data
  "/api/v3/seller/delivery_methods/calculators":
    get:
      summary: List the ways a method can be priced
      tags:
      - Delivery Methods
      security:
      - bearer_auth: []
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: calculators listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        name:
                          type: string
                        preference_schema:
                          type: array
                          items:
                            type: object
                required:
                - data
  "/api/v3/seller/delivery_profiles":
    get:
      summary: List delivery profiles
      tags:
      - Delivery Profiles
      security:
      - bearer_auth: []
      description: |
        The marketplace's delivery profiles — what kind of goods a product is
        (parcel, digital, pallet), which decides how it can be shipped.

        Read only. A seller assigns one to a product as `delivery_profile_id`;
        the profiles themselves, and the zones and methods behind them, are the
        marketplace's. A product created without one lands on the profile
        marked `default`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: delivery profiles listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryProfile"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
  "/api/v3/seller/delivery_zones":
    get:
      summary: List delivery zones
      tags:
      - Delivery Zones
      security:
      - bearer_auth: []
      description: |
        The marketplace's delivery zones — where its methods may ship to.

        Read only: a seller narrows their own method to one of these and never
        draws one. Pass `delivery_profile_id` to list only the zones under the
        profile a method belongs to, which is what the method form's picker
        asks for.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: delivery_profile_id
        in: query
        required: false
        description: Only zones under this delivery profile
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: delivery zones listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeliveryZone"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
  "/api/v3/seller/direct_uploads":
    post:
      summary: Create a direct upload
      tags:
      - Uploads
      security:
      - bearer_auth: []
      description: |
        Presigns an upload target for a file the seller is about to send.

        Three steps: post the file's metadata here, `PUT` the bytes to the
        returned `direct_upload.url` with the headers it names, then send the
        returned `signed_id` wherever the file belongs — as a requirement
        submission's `file`, or as `logo`, `square_logo` or `cover_photo` on the
        profile.

        The blob is attached to nothing at this point. The endpoint that consumes
        the `signed_id` is the one that checks ownership.

        `checksum` is the file's MD5 digest, base64-encoded — the storage service
        verifies the upload against it.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: upload target created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DirectUploadResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blob:
                  type: object
                  properties:
                    filename:
                      type: string
                      example: registration.pdf
                    byte_size:
                      type: integer
                      example: 51234
                    checksum:
                      type: string
                      description: Base64-encoded MD5 digest of the file
                      example: rL0Y20zC+Fzt72VPzMSk2A==
                    content_type:
                      type: string
                      example: application/pdf
                  required:
                  - filename
                  - byte_size
                  - checksum
                  - content_type
              required:
              - blob
  "/api/v3/seller/exports":
    post:
      summary: Create an export
      tags:
      - Exports
      security:
      - bearer_auth: []
      description: |
        Queues a CSV of this seller's own records.

        Only datasets that can be narrowed to a single seller are offered, so
        an export can never contain another seller's rows however it is
        filtered. The seller and the store come from the request context
        whatever the payload says.

        Generation runs in the background: poll `GET /api/v3/seller/exports/{id}`
        until `done` is true, then fetch `download_url`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: export queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Export"
        '422':
          description: type cannot be scoped to one seller
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - orders
                  - products
                  description: Which dataset to export.
                record_selection:
                  type: string
                  enum:
                  - filtered
                  - all
                  description: "`filtered` (default) honours `search_params`; `all`
                    exports everything this seller owns."
                search_params:
                  type: object
                  description: Ransack predicates, the same shape the list endpoints
                    take. Ignored when `record_selection` is `all`.
                  additionalProperties: true
                results_url:
                  type: string
                  description: Panel URL the export-done email links back to. Honoured
                    only when it matches one of the store's allowed origins.
              required:
              - type
  "/api/v3/seller/exports/{id}":
    parameters:
    - name: id
      in: path
      description: Export ID
      required: true
      schema:
        type: string
    get:
      summary: Get an export
      tags:
      - Exports
      security:
      - bearer_auth: []
      description: |
        Reads one of this seller's exports. Poll this until `done` is true,
        then fetch `download_url`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: export found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Export"
        '404':
          description: another seller's export
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/exports/{id}/download":
    parameters:
    - name: id
      in: path
      description: Export ID
      required: true
      schema:
        type: string
    get:
      summary: Download an export
      tags:
      - Exports
      security:
      - bearer_auth: []
      description: |
        Streams the finished CSV.

        The bytes are served by this endpoint rather than through a redirect,
        so the seller's own session authorizes every download.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '422':
          description: export is still being written
          content:
            text/csv:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: another seller's export
          content:
            text/csv:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/orders/{order_id}/fulfillments":
    parameters:
    - name: order_id
      in: path
      description: Prefixed order ID
      required: true
      schema:
        type: string
    get:
      summary: List fulfillments
      tags:
      - Fulfillments
      security:
      - bearer_auth: []
      description: |
        The parcels this seller owes on one order.

        Reached through the order, which is itself fetched through the acting
        seller — so a fulfillment on somebody else's order is unreachable
        whatever ids are sent.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: fulfillments listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Fulfillment"
                required:
                - data
  "/api/v3/seller/orders/{order_id}/fulfillments/{id}/fulfill":
    parameters:
    - name: order_id
      in: path
      description: Prefixed order ID
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: Prefixed fulfillment ID
      required: true
      schema:
        type: string
    patch:
      summary: Fulfill (ship) a parcel
      tags:
      - Fulfillments
      security:
      - bearer_auth: []
      description: |
        Marks the parcel shipped.

        This is the same workflow the marketplace operator runs, so the
        customer's dispatch email, the label purchase and any extension hooks
        happen exactly as they would had the operator shipped it.

        `items` narrows the dispatch to part of what the fulfillment holds; the
        remainder splits onto a new one. Omit it to ship the lot.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: parcel shipped
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Fulfillment"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking:
                  type: string
                  description: Carrier tracking number
                tracking_carrier:
                  type: string
                  description: Carrier name
                notify_customer:
                  type: boolean
                  description: Send the dispatch email (default true)
                items:
                  type: array
                  description: Ship only these lines; the rest split onto a new fulfillment
                  items:
                    type: object
                    properties:
                      item_id:
                        type: string
                        description: Prefixed line item ID
                      quantity:
                        type: integer
                    required:
                    - item_id
                    - quantity
  "/api/v3/seller/auth/invitations/{id}/lookup":
    parameters:
    - name: id
      in: path
      description: Invitation ID from the emailed link
      required: true
      schema:
        type: string
    get:
      summary: Look up an invitation
      tags:
      - Authentication
      description: |
        Reads an invitation from the emailed link, before anyone signs in.

        The acceptance page needs the invited address to decide whether it is
        asking someone to set a new password or to confirm one they already have.

        Unauthenticated — the ID and token in the emailed link are the
        credential. A wrong token is indistinguishable from an unknown
        invitation: both answer `404`, so the endpoint cannot be used to
        enumerate. An invitation onto the store's own staff rather than a seller
        answers `404` here too.
      parameters:
      - name: token
        in: query
        required: true
        description: The token from the emailed link
        schema:
          type: string
      responses:
        '200':
          description: invitation found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Invitation"
        '404':
          description: wrong token, or an invitation that can no longer be accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/auth/invitations/{id}/accept":
    parameters:
    - name: id
      in: path
      description: Invitation ID from the emailed link
      required: true
      schema:
        type: string
    post:
      summary: Accept an invitation
      tags:
      - Authentication
      description: |
        Accepts the invitation and returns a signed-in seller session, so the new
        member lands in the panel rather than on a login form.

        The email is never taken from the request — it always comes from the
        invitation, which is what stops the link being redirected to another
        address.

        `password` is required when no account exists for the invited address, in
        which case it sets one. When an account already exists, the same field is
        how the person proves the account is theirs.
      parameters:
      - name: token
        in: query
        required: true
        description: The token from the emailed link
        schema:
          type: string
      responses:
        '200':
          description: invitation accepted, session issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '404':
          description: wrong token, or an invitation that can no longer be accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: password123
                password_confirmation:
                  type: string
                  example: password123
                first_name:
                  type: string
                  example: Robin
                last_name:
                  type: string
                  example: Ellis
  "/api/v3/seller/invitations":
    get:
      summary: List pending invitations
      tags:
      - Team
      security:
      - bearer_auth: []
      description: |
        Offers nobody has accepted yet, newest first.

        Pending only — an accepted invitation is a team member, and shows up on
        `GET /api/v3/seller/team` instead.

        Sending an invitation lives on `team`, because that is hiring. Chasing or
        withdrawing one is bookkeeping on the offer itself, so it lives here.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: invitations listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Invitation"
                required:
                - data
  "/api/v3/seller/invitations/{id}/resend":
    parameters:
    - name: id
      in: path
      description: Invitation ID
      required: true
      schema:
        type: string
    patch:
      summary: Resend an invitation
      tags:
      - Team
      security:
      - bearer_auth: []
      description: |
        Sends the invitation email again, for a colleague who never got the first
        one. An invitation whose window has closed is refused rather than
        re-sent.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: invitation resent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Invitation"
        '404':
          description: another seller's invitation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/invitations/{id}":
    parameters:
    - name: id
      in: path
      description: Invitation ID
      required: true
      schema:
        type: string
    delete:
      summary: Revoke an invitation
      tags:
      - Team
      security:
      - bearer_auth: []
      description: Withdraws an offer that has not been accepted.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: invitation revoked
        '404':
          description: another seller's invitation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/me":
    get:
      summary: Current user
      tags:
      - Account
      security:
      - bearer_auth: []
      description: |
        The signed-in user, the sellers they may act for, and what they may do on
        the selected one.

        This is the one authenticated endpoint that answers without
        `X-Spree-Seller-Id` — it is what tells the panel which seller to name.
        Sending the header narrows `permission_keys` and `permissions` to that
        seller; without it both are empty, because capability is per seller and
        there is no answer spanning all of them.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: false
        description: The seller to report capability for. Omit to list sellers without
          narrowing permissions.
        schema:
          type: string
      responses:
        '200':
          description: current user returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SellerMeResponse"
        '401':
          description: missing or invalid token
          content:
            application/json:
              example:
                error:
                  code: authentication_required
                  message: Authentication required
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/onboarding":
    get:
      summary: Get onboarding checklist
      tags:
      - Onboarding
      security:
      - bearer_auth: []
      description: |
        What this marketplace asks of the seller before it will admit them.

        Singular: the checklist is always the acting seller's. Every answer is
        computed server-side by the same evaluator the operator's own view uses,
        so the panel and the operator can never show different progress.

        `progress` counts optional requirements too — it is how far along the
        checklist is, not how close to approval. Read `blocking` on each
        requirement for that.

        Each requirement's `id` is what a submission is posted against. A
        marketplace that asks for nothing returns an empty list, which is a
        complete answer rather than a missing one.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: checklist returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SellerOnboardingResponse"
        '403':
          description: no seller named, or not a member of it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/onboarding/submit_for_review":
    post:
      summary: Submit for review
      tags:
      - Onboarding
      security:
      - bearer_auth: []
      description: |
        Says the seller is ready, moving them from `onboarding` to
        `ready_for_review`.

        Refused with `422` when something required is still outstanding — the
        message names the blocking requirements, and the seller's status is
        unchanged. Returns the same payload as the checklist so the panel can
        re-render from one response.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: submitted for review
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SellerOnboardingResponse"
        '422':
          description: something required is still outstanding
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/orders":
    get:
      summary: List orders
      tags:
      - Orders
      security:
      - bearer_auth: []
      description: |
        What this seller has sold.

        On a marketplace a basket spanning several sellers is split into one
        order each, so these are the seller's own orders rather than a filtered
        view of somebody else's — another seller's order is never reachable,
        whatever id is sent.

        Checkouts still in flight are left out: until one completes it is
        nobody's order.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: Sort field; prefix with `-` for descending
        schema:
          type: string
      responses:
        '200':
          description: orders listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Order"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
  "/api/v3/seller/orders/{id}":
    parameters:
    - name: id
      in: path
      description: Prefixed order ID
      required: true
      schema:
        type: string
    get:
      summary: Get an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      description: |
        One order, as the seller needs it to pack and post the parcel: the
        lines with their SKUs, where it ships to, and a fulfillment per parcel.

        How the customer paid the marketplace is deliberately absent — that is
        between the buyer and the operator.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: order found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
        '404':
          description: another seller's order
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/orders/{id}/cancel":
    parameters:
    - name: id
      in: path
      description: Prefixed order ID
      required: true
      schema:
        type: string
    patch:
      summary: Cancel an order
      tags:
      - Orders
      security:
      - bearer_auth: []
      description: |
        Withdraws from an order this seller cannot fulfil.

        Restocking and any refund are the cancellation's own concern, so a
        seller cannot cancel without the money and the stock following.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: order canceled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Order"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_customer:
                  type: boolean
                  description: Email the customer about the cancellation
  "/api/v3/seller/auth/password_resets":
    post:
      summary: Request password reset
      tags:
      - Authentication
      description: |
        Requests a password reset email for a seller.

        Unauthenticated. Always answers `202`, whether or not the address
        belongs to a seller, so this cannot be used to discover which accounts
        exist. A store staff member who runs no seller is treated as no match:
        they have no seller panel to be sent to.

        `redirect_url` is where the emailed link should point, with the reset
        token appended as a `token` query param. It is honoured only when it
        matches one of the store's allowed origins; otherwise it is silently
        ignored and the server resolves the seller panel origin itself. The
        email is delivered by Spree via the
        `seller_user.password_reset_requested` event, which is never forwarded
        to webhook endpoints.
      parameters: []
      responses:
        '202':
          description: reset requested
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: seller@acme.test
                redirect_url:
                  type: string
                  example: https://sellers.your-store.com/reset-password
                  description: Must match an allowed origin of the store; ignored
                    otherwise.
              required:
              - email
  "/api/v3/seller/auth/password_resets/{id}":
    patch:
      summary: Reset password
      tags:
      - Authentication
      description: |
        Spends a password reset token (the `token` query param from the emailed
        link), sets the new password and signs the seller in: the response
        carries a seller JWT and the rotatable refresh token is set in an
        HttpOnly cookie, so they land in the panel rather than on a login form.

        The token is single-use, and resetting revokes every other session the
        account holds. A token whose seller membership has since been revoked is
        refused exactly as an expired one.
      parameters:
      - name: id
        in: path
        description: The reset token from the emailed link
        required: true
        schema:
          type: string
      responses:
        '200':
          description: password reset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '422':
          description: invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: password_reset_token_invalid
                  message: Password reset token is invalid or has expired.
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: new-password-123
                password_confirmation:
                  type: string
                  example: new-password-123
              required:
              - password
              - password_confirmation
  "/api/v3/seller/policies":
    get:
      summary: List policies
      tags:
      - Policies
      security:
      - bearer_auth: []
      description: |
        This seller's own policy documents.

        Rooted in the acting seller, so the marketplace operator's store
        policies and every other seller's are invisible here. A seller starts
        with none: what they are expected to publish is decided by the
        marketplace's onboarding checklist.
      parameters:
