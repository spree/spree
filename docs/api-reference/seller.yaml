  "/api/v3/seller/profile":
    get:
      summary: Get profile
      tags:
      - Profile
      security:
      - bearer_auth: []
      description: |
        The seller's own record.

        Singular by nature: the seller in play is always the one named by
        `X-Spree-Seller-Id`, never an id in the path — so a seller cannot address
        another seller here even by guessing one.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: profile returned
          content:
            application/json:
              example:
                id: sel_UkLWZg9DAJ
                name: Seller 81
                slug: seller-81
                about: ''
                about_html: ''
                logo_url:
                square_logo_url:
                cover_photo_url:
                status: approved
                legal_name:
                registration_number:
                contact_email:
                billing_email:
                tax_remittance: seller
                payouts_schedule_interval:
                holiday_mode_until:
                terms_accepted_at: '2026-01-15T12:00:00.000Z'
                created_at: '2026-01-15T12:00:00.000Z'
                minimum_payout_amount:
                on_holiday: false
                sellable: true
                default_currency: USD
                supported_currencies:
                - USD
                - EUR
                - GBP
                products_count: 0
              schema:
                "$ref": "#/components/schemas/Profile"
        '403':
          description: no seller named, or not a member of it
          content:
            application/json:
              example:
                error:
                  code: access_denied
                  message: You do not have access to this seller.
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update profile
      tags:
      - Profile
      security:
      - bearer_auth: []
      description: |
        Edits presentation, contact details and addresses.

        Readable but **not** writable, by design: `status` — the lifecycle belongs
        to the marketplace operator's workflows — the settlement terms, and
        `slug`, since a seller renaming their own storefront address would break
        every link pointing at it.

        `accept_terms: true` stamps the moment the seller accepted the
        marketplace's terms, which is what the matching onboarding requirement
        reads. One-way — sending `false` does not unmake the stamp.

        `custom_fields` is narrowed server-side to the definitions this
        marketplace's onboarding actually asks this seller for; a field nothing
        asked for is ignored rather than written.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              example:
                id: sel_UkLWZg9DAJ
                name: Acme Supplies
                slug: seller-83
                about: ''
                about_html: ''
                logo_url:
                square_logo_url:
                cover_photo_url:
                status: approved
                legal_name:
                registration_number:
                contact_email: hello@acme.test
                billing_email:
                tax_remittance: seller
                payouts_schedule_interval:
                holiday_mode_until:
                terms_accepted_at: '2026-01-15T12:00:00.000Z'
                created_at: '2026-01-15T12:00:00.000Z'
                minimum_payout_amount:
                on_holiday: false
                sellable: true
                default_currency: USD
                supported_currencies:
                - USD
                - EUR
                - GBP
                products_count: 0
              schema:
                "$ref": "#/components/schemas/Profile"
        '422':
          description: validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Name can't be blank
                  details:
                    name:
                    - can't be blank
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Acme Supplies
                contact_email:
                  type: string
                  format: email
                  nullable: true
                  example: hello@acme.test
                billing_email:
                  type: string
                  format: email
                  nullable: true
                  example: billing@acme.test
                about:
                  type: string
                  nullable: true
                  description: Sanitized HTML — the seller's public description
                legal_name:
                  type: string
                  nullable: true
                  description: The business a commission invoice is made out to
                registration_number:
                  type: string
                  nullable: true
                logo:
                  type: string
                  nullable: true
                  description: ActiveStorage signed id; `null` removes the attachment
                square_logo:
                  type: string
                  nullable: true
                cover_photo:
                  type: string
                  nullable: true
                accept_terms:
                  type: boolean
                  description: Stamps acceptance of the marketplace terms
                billing_address:
                  type: object
                  additionalProperties: true
                custom_fields:
                  type: array
                  items:
                    type: object
                    properties:
                      custom_field_definition_id:
