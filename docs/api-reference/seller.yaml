          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update a product
      tags:
      - Products
      security:
      - bearer_auth: []
      description: Edits a product the acting seller owns.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: product updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Hand-thrown mug, large
                description:
                  type: string
                slug:
                  type: string
                status:
                  type: string
                  example: active
                tags:
                  type: array
                  items:
                    type: string
                category_ids:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  additionalProperties: true
    delete:
      summary: Delete a product
      tags:
      - Products
      security:
      - bearer_auth: []
      description: Deletes a product the acting seller owns.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: product deleted
  "/api/v3/seller/profile":
    get:
      summary: Get profile
      tags:
      - Profile
      security:
      - bearer_auth: []
      description: |
        The seller's own record.

        Singular by nature: the seller in play is always the one named by
        `X-Spree-Seller-Id`, never an id in the path — so a seller cannot address
        another seller here even by guessing one.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: profile returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '403':
          description: no seller named, or not a member of it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update profile
      tags:
      - Profile
      security:
      - bearer_auth: []
      description: |
        Edits presentation, contact details and addresses.

        Readable but **not** writable, by design: `status` — the lifecycle belongs
        to the marketplace operator's workflows — the settlement terms, and
        `slug`, since a seller renaming their own storefront address would break
        every link pointing at it.

        `accept_terms: true` stamps the moment the seller accepted the
        marketplace's terms, which is what the matching onboarding requirement
        reads. One-way — sending `false` does not unmake the stamp.

        `custom_fields` is narrowed server-side to the definitions this
        marketplace's onboarding actually asks this seller for; a field nothing
        asked for is ignored rather than written.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Acme Supplies
                contact_email:
                  type: string
                  format: email
                  nullable: true
                  example: hello@acme.test
                billing_email:
                  type: string
                  format: email
                  nullable: true
                  example: billing@acme.test
                about:
                  type: string
                  nullable: true
                  description: Sanitized HTML — the seller's public description
                legal_name:
                  type: string
                  nullable: true
                  description: The business a commission invoice is made out to
                registration_number:
                  type: string
                  nullable: true
                logo:
                  type: string
                  nullable: true
                  description: ActiveStorage signed id; `null` removes the attachment
                square_logo:
                  type: string
                  nullable: true
                cover_photo:
                  type: string
                  nullable: true
                accept_terms:
                  type: boolean
                  description: Stamps acceptance of the marketplace terms
                billing_address:
                  type: object
                  additionalProperties: true
                custom_fields:
                  type: array
                  items:
                    type: object
                    properties:
                      custom_field_definition_id:
                        type: string
                        example: cfd_abc123
                      value:
                        description: Any JSON value the definition accepts
  "/api/v3/seller/requirements/{requirement_id}/submissions":
    parameters:
    - name: requirement_id
      in: path
      description: Requirement ID, as returned by `GET /api/v3/seller/onboarding`
      required: true
      schema:
        type: string
    post:
      summary: Submit against a requirement
      tags:
      - Onboarding
      security:
      - bearer_auth: []
      description: |
        What the seller says about one requirement: an attestation they tick, a
        document they upload, a reference they paste.

        Create only. A submission records what was said and when, so a seller who
        needs to correct something submits again rather than editing, and the
        latest one counts.

        `file` is **not** a multipart upload — it is the `signed_id` returned by
        `POST /api/v3/seller/direct_uploads`, so the bytes are already in storage
        by the time this runs.

        An attestation is accepted on the spot; a requirement the operator
        reviews comes back `pending`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: submission recorded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RequirementSubmission"
        '404':
          description: a requirement belonging to another marketplace
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Anything the seller wants to say alongside the submission
                reference:
                  type: string
                  description: A reference number or external identifier, for requirements
                    that ask for one
                file:
                  type: string
                  description: A direct-upload `signed_id`, for requirements that
                    ask for a document
  "/api/v3/seller/requirement_submissions/{id}/download":
    parameters:
    - name: id
      in: path
      description: Submission ID
      required: true
      schema:
        type: string
    get:
      summary: Download a submitted document
      tags:
      - Onboarding
      security:
      - bearer_auth: []
      description: |
        Streams the file attached to one of this seller's submissions.

        Served through the API rather than from a storage URL on purpose: these
        are identity and registration documents, so every read is authorized
        against the acting seller. Another seller's submission answers `404`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '404':
          description: another seller's submission
          content:
            application/octet-stream:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/seller/stock_locations":
    get:
      summary: List stock locations
      tags:
      - Stock Locations
      security:
      - bearer_auth: []
      description: |
        Where this seller keeps stock, and so where their returns are sent.

        Rooted in the acting seller, so the marketplace operator's own warehouses
        never appear here.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: Sort field; prefix with `-` for descending
        schema:
          type: string
      responses:
        '200':
          description: stock locations listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StockLocation"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
    post:
      summary: Create a stock location
      tags:
      - Stock Locations
      security:
      - bearer_auth: []
      description: |
        Adds a place this seller ships from.

        The seller and the store come from the request context whatever the
        payload says.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: stock location created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StockLocation"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Main warehouse
                company:
                  type: string
                  nullable: true
                address1:
                  type: string
                  nullable: true
                  example: 1 Kiln Lane
                address2:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                  example: Portland
                zipcode:
                  type: string
                  nullable: true
                  example: '97205'
                country_code:
                  type: string
                  nullable: true
                  example: US
                state_code:
                  type: string
                  nullable: true
                  example: OR
                state_name:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                active:
                  type: boolean
                  description: Set `false` to retire a location — there is no delete
                default:
                  type: boolean
                kind:
                  type: string
                  example: warehouse
              required:
              - name
  "/api/v3/seller/stock_locations/{id}":
    parameters:
    - name: id
      in: path
      description: Stock location ID
      required: true
      schema:
        type: string
    get:
      summary: Get a stock location
      tags:
      - Stock Locations
      security:
      - bearer_auth: []
      description: |
        A stock location the acting seller owns. An id belonging to another
        seller — or to the marketplace operator — answers `404`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: stock location returned
          content:
            application/json:
              example:
                id: sloc_UkLWZg9DAJ
                name: Marsha Turner
                address1: 1600 Pennsylvania Ave NW
                city: Washington
                zipcode: '20500'
                country_code: US
                country_name: United States
                state_code: AL
                state_text: AL
                pickup_ready_in_minutes:
                pickup_instructions:
                address2:
                state_name:
                phone: "(202) 456-1111"
                company:
                active: true
                default: false
                kind: warehouse
                created_at: '2026-01-15T12:00:00.000Z'
                updated_at: '2026-01-15T12:00:00.000Z'
              schema:
                "$ref": "#/components/schemas/StockLocation"
        '404':
          description: another seller's stock location
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update a stock location
      tags:
      - Stock Locations
      security:
      - bearer_auth: []
      description: |
        Edits a stock location the acting seller owns.

        There is no delete: a location holds stock levels and is named on
        historical fulfillments, so a seller retires one by setting `active` to
        `false`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: stock location updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StockLocation"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Main warehouse
                address1:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                zipcode:
                  type: string
                  nullable: true
                country_code:
                  type: string
                  nullable: true
                state_code:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                active:
                  type: boolean
                default:
                  type: boolean
  "/api/v3/seller/tax_identifiers":
    get:
      summary: List tax registrations
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        The seller's own registrations — the numbers the marketplace's
        commission invoice is made out to, and what makes EU reverse charge on
        that fee possible.

        A collection rather than a single field: a business trading in more
        than one regime holds a registration in each, and they are not
        alternatives. One per kind.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: registrations returned
    post:
      summary: Add a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        `kind` names the regime — `eu_vat`, `gb_vat`, and whatever else a
        validator is registered for. Any string is accepted; what a kind means
        is decided by its validator, and a kind nothing is registered for is
        stored and used as entered.

        A number a registered validator refuses is rejected outright rather
        than stored, so a typo cannot reach an invoice.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: registration recorded
        '422':
          description: the number is not valid for its regime
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  example: eu_vat
                value:
                  type: string
                  example: DE100000008
              required:
              - kind
              - value
  "/api/v3/seller/tax_identifiers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Correct a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        A changed number drops its validation verdict, because that answer was
        about the old one.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: registration corrected
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  example: eu_vat
                value:
                  type: string
                  example: DE100000016
    delete:
      summary: Remove a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: registration removed
  "/api/v3/seller/tax_identifiers/{id}/validate":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Re-check a registration against its registry
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        A registry answers "valid now", so a number verified last year may have
        been deregistered since. Refused when no registry validator is
        installed for the kind — core format-checks EU VAT numbers but asks no
        registry, so a stock install answers 422 here rather than queueing a
        check nobody can answer.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '422':
          description: no registry validator is installed for this kind
  "/api/v3/seller/team":
    get:
      summary: List team members
      tags:
      - Team
      security:
      - bearer_auth: []
      description: |
        The people who run this seller.

        Rooted at the acting seller throughout, so a seller only ever sees their
        own team. Unpaginated — a seller's team is small by nature.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: team members listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/TeamMember"
                required:
                - data
    post:
      summary: Invite a team member
      tags:
      - Team
      security:
      - bearer_auth: []
      description: |
        Invites a colleague onto this seller's team. They join when they accept,
        on the same invitation rail — and the same email — the marketplace
        operator's own invitations use.

        Hiring is not a lifecycle transition: a trading seller's status is
        untouched by taking someone on.

        The role is not a parameter. Every member holds the seller's own seeded
        role, which already carries the whole seller vocabulary.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: invitation sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Invitation"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: colleague@acme.test
              required:
              - email
  "/api/v3/seller/team/{id}":
    parameters:
    - name: id
      in: path
      description: Team member (user) ID
      required: true
      schema:
        type: string
    delete:
      summary: Remove a team member
      tags:
      - Team
      security:
      - bearer_auth: []
      description: |
        Revokes a member's access, removing every role they hold on this seller.

        The team can never reach zero: emptying it would leave a seller nobody
        can sign in to, and only the marketplace operator could put someone back.
        The last remaining member is refused with `422`.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: member removed
        '422':
          description: cannot remove the last remaining member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: not a member of this seller
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Authentication
  description: Seller sign-in, token refresh, logout, and invitation acceptance
- name: Account
  description: The signed-in user, the sellers they may act for, and what they may
    do
- name: Countries
  description: Country and state reference data for the panel's address forms
- name: Delivery Methods
  description: The seller's own ways to ship, and the marketplace methods shared with
    them
- name: Delivery Profiles
  description: The marketplace's delivery vocabulary — what kind of goods a product
    is, which decides how it ships
- name: Delivery Zones
  description: The marketplace's destinations, for narrowing where a seller's own
    method ships
- name: Onboarding
  description: The marketplace checklist a seller completes before admission, and
    what they submit against it
- name: Policies
  description: The seller's own legal documents, as the marketplace asks them to publish
- name: Product Types
  description: The types a seller may list a product against, and what each adds
- name: Products
  description: The seller's own catalog
- name: Profile
  description: The seller's own record — presentation, contact details, addresses,
    and tax registration
- name: Stock Locations
  description: Where the seller keeps stock, and so where their returns are sent
- name: Team
  description: Who runs this seller, and the invitations nobody has accepted yet
- name: Uploads
  description: Presigned direct uploads for the documents onboarding asks for
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for an authenticated seller session (`seller_api` audience)
  schemas:
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        count:
          type: integer
          example: 100
          description: Total number of records
        pages:
          type: integer
          example: 4
          description: Total number of pages
        from:
          type: integer
          example: 1
          description: Index of first record on this page
        to:
          type: integer
          example: 25
          description: Index of last record on this page
        in:
          type: integer
          example: 25
          description: Number of records on this page
        previous:
          type: integer
          nullable: true
          example:
          description: Previous page number
        next:
          type: integer
          nullable: true
          example: 2
          description: Next page number
      required:
      - page
      - limit
      - count
      - pages
      - from
      - to
      - in
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: record_not_found
            message:
              type: string
              example: Record not found
            details:
              type: object
              description: Field-specific validation errors
              nullable: true
              example:
                name:
                - is too short
                - is required
                email:
                - is invalid
          required:
          - code
          - message
      required:
      - error
      example:
        error:
          code: validation_error
          message: Validation failed
          details:
            name:
            - is too short
            email:
            - is invalid
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token, `seller_api` audience
        user:
          "$ref": "#/components/schemas/TeamMember"
        sellers:
          type: array
          description: The sellers this user may act for. Pick one and send its `id`
            as `X-Spree-Seller-Id` on every subsequent request.
          items:
            "$ref": "#/components/schemas/SellerSummary"
      required:
      - token
      - user
      - sellers
    PermissionRule:
      type: object
      description: A single permission rule (CanCanCan rule). Rules are applied in
        order, last-matching-wins.
      properties:
        allow:
          type: boolean
          description: true for `can`, false for `cannot`
        actions:
          type: array
          items:
            type: string
          description: Action names, e.g. ["read", "update"] or ["manage"]
        subjects:
          type: array
          items:
            type: string
          description: Subject class names, e.g. ["Spree::Product"] or ["all"]
        has_conditions:
          type: boolean
          description: True if the server-side rule has per-record conditions. The
            SPA shows the action optimistically and handles 403 from the API.
      required:
      - allow
      - actions
      - subjects
      - has_conditions
    ImportSchemaField:
      type: object
      description: A canonical column of an import type, including per-store custom
        field columns
      properties:
        name:
          type: string
          description: Canonical field name used in mappings
          example: slug
        label:
          type: string
          description: Human-readable label
          example: Slug
        required:
          type: boolean
          description: Whether the field must be mapped before processing
      required:
      - name
      - label
      - required
    CheckoutRequirement:
      type: object
      properties:
        step:
          type: string
          description: Checkout step this requirement belongs to
          example: payment
        field:
          type: string
          description: Field that needs to be satisfied
          example: payment
        message:
          type: string
          description: Human-readable requirement message
          example: Add a payment method
      required:
      - step
      - field
      - message
    CartWarning:
      type: object
      description: A warning about a cart issue (e.g., item removed due to stock change)
      properties:
        code:
          type: string
          description: Machine-readable warning code
          example: line_item_removed
        message:
          type: string
          description: Human-readable warning message
          example: Blue T-Shirt was removed because it was sold out
        line_item_id:
          type: string
          nullable: true
          description: Prefixed line item ID (when applicable)
          example: li_abc123
        variant_id:
          type: string
          nullable: true
          description: Prefixed variant ID (when applicable)
          example: variant_abc123
        item_index:
          type: integer
          nullable: true
          description: Position in the submitted items array, for warnings raised
            while applying a batch of item changes
          example: 1
      required:
      - code
      - message
    FulfillmentManifestItem:
      type: object
      description: An item within a fulfillment — which line item and how many units
        are in this fulfillment
      properties:
        item_id:
          type: string
          description: Line item ID
          example: li_abc123
        variant_id:
          type: string
          description: Variant ID
          example: variant_abc123
        quantity:
          type: integer
          description: Quantity in this fulfillment
          example: 2
      required:
      - item_id
      - variant_id
      - quantity
    AdminUserRoleAssignment:
      type: object
      description: A role assignment for the current store on a staff member
      properties:
        id:
          type: string
          description: Prefixed role ID
          example: role_abc123
        name:
          type: string
          description: Role name
          example: admin
      required:
      - id
      - name
    AdminUserStore:
      type: object
      description: A store the staff member can access through a role assignment
      properties:
        id:
          type: string
          description: Prefixed store ID
          example: store_abc123
        name:
          type: string
          description: Store name
          example: My Store
        code:
          type: string
          description: Store code
          example: my-store
      required:
      - id
      - name
      - code
    PreferenceField:
      type: object
      description: A single configurable preference on a payment method, promotion
        rule/action, or calculator. The frontend uses `type` + `default` to render
        a sensible input.
      properties:
        key:
          type: string
          example: amount_min
        type:
          type: string
          example: decimal
          description: string | text | password | integer | decimal | boolean | array
            | hash
        default:
          description: Default value (any JSON type), null when there is no default
          nullable: true
      required:
      - key
      - type
    PromotionActionCalculator:
      type: object
      description: The action's nested calculator (when the action carries one — null
        for actions like `free_shipping`)
      properties:
        type:
          type: string
          example: flat_rate
          description: Wire shorthand for the calculator subclass
        label:
          type: string
          example: Flat Rate
        preferences:
          type: object
          additionalProperties: true
        preference_schema:
          type: array
          items:
            "$ref": "#/components/schemas/PreferenceField"
      required:
      - type
      - label
      - preferences
      - preference_schema
    PromotionActionLineItem:
      type: object
      description: One row in a `create_line_items` action — the variant added to
        the order and how many
      properties:
        variant_id:
          type: string
          example: variant_abc123
        quantity:
          type: integer
          example: 1
      required:
      - variant_id
      - quantity
    SellerSummary:
      type: object
      description: A seller the signed-in user may act for
      properties:
        id:
          type: string
          description: Prefixed seller ID — send as `X-Spree-Seller-Id`
          example: sel_abc123
        name:
          type: string
          example: Acme Supplies
        status:
          type: string
          example: approved
          description: Seller lifecycle status
      required:
      - id
      - name
      - status
    SellerMeSummary:
      type: object
      description: A seller the signed-in user may act for, as `/me` reports it —
        the login response carries the same fields without `slug`.
      properties:
        id:
          type: string
          description: Prefixed seller ID — send as `X-Spree-Seller-Id`
          example: sel_abc123
        name:
          type: string
          example: Acme Supplies
        slug:
          type: string
          example: acme-supplies
        status:
          type: string
          example: approved
          description: Seller lifecycle status
      required:
      - id
      - name
