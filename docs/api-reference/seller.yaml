                refundable_total: '10.0'
                display_refunded_total: "$0.00"
              schema:
                "$ref": "#/components/schemas/Return"
        '422':
          description: more than was shipped
          content:
            application/json:
              example:
                error:
                  code: processing_error
                  message: Only 1 of Product 1687120 can be returned
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      fulfillment_item_id:
                        type: string
                      quantity:
                        type: integer
                    required:
                    - fulfillment_item_id
                    - quantity
                reason_id:
                  type: string
                  nullable: true
                stock_location_id:
                  type: string
                  nullable: true
                memo:
                  type: string
                  nullable: true
              required:
              - items
  "/api/v3/seller/orders/{order_id}/returns/{id}/approve":
    parameters:
    - name: order_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Approve a return
      tags:
      - Returns
      security:
      - bearer_auth: []
      description: Agrees the goods may come back.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: return approved
          content:
            application/json:
              example:
                id: ret_UkLWZg9DAJ
                number: RET1001
                status: approved
                order_id: or_UkLWZg9DAJ
                reason_id:
                refund_total: '10.0'
                display_refund_total: "$10.00"
                approved_at: '2026-01-15T12:00:00Z'
                received_at:
                refunded_at:
                canceled_at:
                memo:
                stock_location_id: sloc_UkLWZg9DAJ
                refunded_total: '0.0'
                refundable_total: '10.0'
                display_refunded_total: "$0.00"
              schema:
                "$ref": "#/components/schemas/Return"
  "/api/v3/seller/orders/{order_id}/returns/{id}/receive":
    parameters:
    - name: order_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Receive a return
      tags:
      - Returns
      security:
      - bearer_auth: []
      description: |
        Records what actually arrived, and whether it can be sold again.

        Omitting `items` receives everything as requested and resellable.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: return received
          content:
            application/json:
              example:
                id: ret_UkLWZg9DAJ
                number: RET1001
                status: received
                order_id: or_UkLWZg9DAJ
                reason_id:
                refund_total: '10.0'
                display_refund_total: "$10.00"
                approved_at: '2026-01-15T12:00:00Z'
                received_at: '2026-01-15T12:00:00Z'
                refunded_at:
                canceled_at:
                memo:
                stock_location_id: sloc_UkLWZg9DAJ
                refunded_total: '0.0'
                refundable_total: '10.0'
                display_refunded_total: "$0.00"
              schema:
                "$ref": "#/components/schemas/Return"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      return_line_item_id:
                        type: string
                      quantity:
                        type: integer
                      resellable:
                        type: boolean
                    required:
                    - return_line_item_id
                    - quantity
  "/api/v3/seller/orders/{order_id}/returns/{id}/refund":
    parameters:
    - name: order_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Refund a return
      tags:
      - Returns
      security:
      - bearer_auth: []
      description: |
        Gives the customer their money back.

        The seller is merchant of record for their own child order, so this is
        theirs to do. The amount is bounded by what the return is owed and, on
        a basket split between sellers, by this order's share of the payment —
        never a sibling's.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: return refunded
          content:
            application/json:
              example:
                id: ret_UkLWZg9DAJ
                number: RET1001
                status: refunded
                order_id: or_UkLWZg9DAJ
                reason_id:
                refund_total: '10.0'
                display_refund_total: "$10.00"
                approved_at: '2026-01-15T12:00:00Z'
                received_at: '2026-01-15T12:00:00Z'
                refunded_at: '2026-01-15T12:00:00Z'
                canceled_at:
                memo:
                stock_location_id: sloc_UkLWZg9DAJ
                refunded_total: '10.0'
                refundable_total: '0.0'
                display_refunded_total: "$10.00"
              schema:
                "$ref": "#/components/schemas/Return"
        '422':
          description: more than the return is owed
          content:
            application/json:
              example:
                error:
                  code: processing_error
                  message: refund_exceeds_balance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  nullable: true
                refund_method:
                  type: string
                  enum:
                  - original_payment
                  - store_credit
  "/api/v3/seller/orders/{order_id}/returns/{id}/cancel":
    parameters:
    - name: order_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Cancel a return
      tags:
      - Returns
      security:
      - bearer_auth: []
      description: Calls the return off.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: return canceled
          content:
            application/json:
              example:
                id: ret_UkLWZg9DAJ
                number: RET1001
                status: canceled
                order_id: or_UkLWZg9DAJ
                reason_id:
                refund_total: '10.0'
                display_refund_total: "$10.00"
                approved_at:
                received_at:
                refunded_at:
                canceled_at: '2026-01-15T12:00:00Z'
                memo:
                stock_location_id: sloc_UkLWZg9DAJ
                refunded_total: '0.0'
                refundable_total: '10.0'
                display_refunded_total: "$0.00"
              schema:
                "$ref": "#/components/schemas/Return"
  "/api/v3/seller/return_reasons":
    get:
      summary: List return reasons
      tags:
      - Returns
      security:
      - bearer_auth: []
      description: |
        Why goods come back, as the marketplace defines it.

        Read-only: the vocabulary is the operator's, and a seller picks from
        it. Retired reasons are left out.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: reasons listed
          content:
            application/json:
              example:
                data:
                - id: rar_UkLWZg9DAJ
                  name: Damaged in transit
                  active: true
                meta:
                  page: 1
                  limit: 25
                  count: 1
                  pages: 1
                  from: 1
                  to: 1
                  in: 1
                  previous:
                  next:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Reason"
                required:
                - data
  "/api/v3/seller/tax_identifiers":
    get:
      summary: List tax registrations
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        The seller's own registrations — the numbers the marketplace's
        commission invoice is made out to, and what makes EU reverse charge on
        that fee possible.

        A collection rather than a single field: a business trading in more
        than one regime holds a registration in each, and they are not
        alternatives. One per kind.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: registrations returned
          content:
            application/json:
              example:
                data:
                - id: txi_UkLWZg9DAJ
                  kind: eu_vat
                  value: DE100000008
                  validation_status:
                  validated_at:
                meta:
                  page: 1
                  limit: 25
                  count: 1
                  pages: 1
                  from: 1
                  to: 1
                  in: 1
                  previous:
                  next:
    post:
      summary: Add a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        `kind` names the regime — `eu_vat`, `gb_vat`, and whatever else a
        validator is registered for. Any string is accepted; what a kind means
        is decided by its validator, and a kind nothing is registered for is
        stored and used as entered.

        A number a registered validator refuses is rejected outright rather
        than stored, so a typo cannot reach an invoice.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: registration recorded
          content:
            application/json:
              example:
                id: txi_UkLWZg9DAJ
                kind: eu_vat
                value: DE100000008
                validation_status:
                validated_at:
        '422':
          description: the number is not valid for its regime
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Number does not look like a valid EU VAT registration
                  details:
                    value:
                    - does not look like a valid EU VAT registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  example: eu_vat
                value:
                  type: string
                  example: DE100000008
              required:
              - kind
              - value
  "/api/v3/seller/tax_identifiers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Correct a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        A changed number drops its validation verdict, because that answer was
        about the old one.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: registration corrected
          content:
            application/json:
              example:
                id: txi_UkLWZg9DAJ
                kind: eu_vat
                value: DE100000016
                validation_status:
                validated_at:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  example: eu_vat
                value:
                  type: string
                  example: DE100000016
    delete:
      summary: Remove a tax registration
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: registration removed
  "/api/v3/seller/tax_identifiers/{id}/validate":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Re-check a registration against its registry
      tags:
      - Tax Identifiers
      security:
      - bearer_auth: []
      description: |
        A registry answers "valid now", so a number verified last year may have
        been deregistered since. Refused when no registry validator is
        installed for the kind — core format-checks EU VAT numbers but asks no
        registry, so a stock install answers 422 here rather than queueing a
        check nobody can answer.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '422':
          description: no registry validator is installed for this kind
          content:
            application/json:
              example:
                error:
                  code: tax_id_not_validatable
                  message: No registry validator is installed for tax identifier kind
                    'eu_vat'
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
tags:
- name: Authentication
  description: Seller sign-in, token refresh, logout, and invitation acceptance
- name: Account
  description: The signed-in user, the sellers they may act for, and what they may
    do
- name: Countries
  description: Country and state reference data for the panel's address forms
- name: Delivery Methods
  description: The seller's own ways to ship, and the marketplace methods shared with
    them
- name: Delivery Profiles
  description: The marketplace's delivery vocabulary — what kind of goods a product
    is, which decides how it ships
- name: Delivery Zones
  description: The marketplace's destinations, for narrowing where a seller's own
    method ships
- name: Onboarding
  description: The marketplace checklist a seller completes before admission, and
    what they submit against it
- name: Policies
  description: The seller's own legal documents, as the marketplace asks them to publish
- name: Product Types
  description: The types a seller may list a product against, and what each adds
- name: Products
  description: The seller's own catalog
- name: Profile
  description: The seller's own record — presentation, contact details, addresses,
    and tax registration
- name: Stock Locations
  description: Where the seller keeps stock, and so where their returns are sent
- name: Team
  description: Who runs this seller, and the invitations nobody has accepted yet
- name: Uploads
  description: Presigned direct uploads for the documents onboarding asks for
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for an authenticated seller session (`seller_api` audience)
  schemas:
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        count:
          type: integer
          example: 100
          description: Total number of records
        pages:
          type: integer
          example: 4
          description: Total number of pages
        from:
          type: integer
          example: 1
          description: Index of first record on this page
        to:
          type: integer
          example: 25
          description: Index of last record on this page
        in:
          type: integer
          example: 25
          description: Number of records on this page
        previous:
          type: integer
          nullable: true
          example:
          description: Previous page number
        next:
          type: integer
          nullable: true
          example: 2
          description: Next page number
      required:
      - page
      - limit
      - count
      - pages
      - from
      - to
      - in
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: record_not_found
            message:
              type: string
              example: Record not found
            details:
              type: object
              description: Field-specific validation errors
              nullable: true
              example:
                name:
                - is too short
                - is required
                email:
                - is invalid
          required:
          - code
          - message
      required:
      - error
      example:
        error:
          code: validation_error
          message: Validation failed
          details:
            name:
            - is too short
            email:
            - is invalid
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token, `seller_api` audience
        user:
          "$ref": "#/components/schemas/TeamMember"
        sellers:
          type: array
          description: The sellers this user may act for. Pick one and send its `id`
            as `X-Spree-Seller-Id` on every subsequent request.
          items:
            "$ref": "#/components/schemas/SellerSummary"
      required:
      - token
      - user
      - sellers
    PermissionRule:
      type: object
      description: A single permission rule (CanCanCan rule). Rules are applied in
        order, last-matching-wins.
      properties:
        allow:
          type: boolean
          description: true for `can`, false for `cannot`
        actions:
          type: array
          items:
            type: string
          description: Action names, e.g. ["read", "update"] or ["manage"]
        subjects:
          type: array
          items:
            type: string
          description: Subject class names, e.g. ["Spree::Product"] or ["all"]
        has_conditions:
          type: boolean
          description: True if the server-side rule has per-record conditions. The
            SPA shows the action optimistically and handles 403 from the API.
      required:
      - allow
      - actions
      - subjects
      - has_conditions
    ImportSchemaField:
      type: object
      description: A canonical column of an import type, including per-store custom
        field columns
      properties:
        name:
          type: string
          description: Canonical field name used in mappings
          example: slug
        label:
          type: string
          description: Human-readable label
          example: Slug
        required:
          type: boolean
          description: Whether the field must be mapped before processing
      required:
      - name
      - label
      - required
    CheckoutRequirement:
      type: object
      properties:
        step:
          type: string
          description: Checkout step this requirement belongs to
          example: payment
        field:
          type: string
          description: Field that needs to be satisfied
          example: payment
        message:
          type: string
          description: Human-readable requirement message
          example: Add a payment method
      required:
      - step
      - field
      - message
    CartWarning:
      type: object
      description: A warning about a cart issue (e.g., item removed due to stock change)
      properties:
        code:
          type: string
          description: Machine-readable warning code
          example: line_item_removed
        message:
          type: string
          description: Human-readable warning message
          example: Blue T-Shirt was removed because it was sold out
        line_item_id:
          type: string
          nullable: true
          description: Prefixed line item ID (when applicable)
          example: li_abc123
        variant_id:
          type: string
          nullable: true
          description: Prefixed variant ID (when applicable)
          example: variant_abc123
        item_index:
          type: integer
          nullable: true
          description: Position in the submitted items array, for warnings raised
            while applying a batch of item changes
          example: 1
      required:
      - code
      - message
    FulfillmentManifestItem:
      type: object
      description: An item within a fulfillment — which line item and how many units
        are in this fulfillment
      properties:
        item_id:
          type: string
          description: Line item ID
          example: li_abc123
        variant_id:
          type: string
          description: Variant ID
          example: variant_abc123
        quantity:
          type: integer
          description: Quantity in this fulfillment
          example: 2
      required:
      - item_id
      - variant_id
      - quantity
    AdminUserRoleAssignment:
      type: object
      description: A role assignment for the current store on a staff member
      properties:
        id:
          type: string
          description: Prefixed role ID
          example: role_abc123
        name:
          type: string
          description: Role name
          example: admin
      required:
      - id
      - name
    AdminUserStore:
      type: object
      description: A store the staff member can access through a role assignment
      properties:
        id:
          type: string
          description: Prefixed store ID
          example: store_abc123
        name:
          type: string
          description: Store name
          example: My Store
        code:
          type: string
          description: Store code
          example: my-store
      required:
      - id
      - name
      - code
    PreferenceField:
      type: object
      description: A single configurable preference on a payment method, promotion
        rule/action, or calculator. The frontend uses `type` + `default` to render
        a sensible input.
      properties:
        key:
          type: string
          example: amount_min
        type:
          type: string
          example: decimal
          description: string | text | password | integer | decimal | boolean | array
            | hash
        default:
          description: Default value (any JSON type), null when there is no default
          nullable: true
      required:
      - key
      - type
    PromotionActionCalculator:
      type: object
      description: The action's nested calculator (when the action carries one — null
        for actions like `free_shipping`)
      properties:
        type:
          type: string
          example: flat_rate
          description: Wire shorthand for the calculator subclass
        label:
          type: string
          example: Flat Rate
        preferences:
          type: object
          additionalProperties: true
        preference_schema:
          type: array
          items:
            "$ref": "#/components/schemas/PreferenceField"
      required:
      - type
      - label
      - preferences
      - preference_schema
    PromotionActionLineItem:
      type: object
      description: One row in a `create_line_items` action — the variant added to
        the order and how many
      properties:
        variant_id:
          type: string
          example: variant_abc123
        quantity:
          type: integer
          example: 1
      required:
      - variant_id
      - quantity
    SellerSummary:
      type: object
      description: A seller the signed-in user may act for
      properties:
        id:
          type: string
          description: Prefixed seller ID — send as `X-Spree-Seller-Id`
          example: sel_abc123
        name:
          type: string
          example: Acme Supplies
        status:
          type: string
          example: approved
          description: Seller lifecycle status
      required:
      - id
      - name
      - status
    SellerMeSummary:
      type: object
      description: A seller the signed-in user may act for, as `/me` reports it —
        the login response carries the same fields without `slug`.
      properties:
        id:
          type: string
          description: Prefixed seller ID — send as `X-Spree-Seller-Id`
          example: sel_abc123
        name:
          type: string
          example: Acme Supplies
        slug:
          type: string
          example: acme-supplies
        status:
          type: string
          example: approved
          description: Seller lifecycle status
      required:
      - id
      - name
      - slug
      - status
    SellerMeResponse:
      type: object
      description: The signed-in user, the sellers they may act for, and what they
        may do on the selected one
      properties:
        user:
          "$ref": "#/components/schemas/TeamMember"
        sellers:
          type: array
          items:
            "$ref": "#/components/schemas/SellerMeSummary"
        permissions:
          type: array
          items:
            "$ref": "#/components/schemas/PermissionRule"
        permission_keys:
          type: array
          items:
            type: string
          description: Permission keys on the selected seller. Empty until `X-Spree-Seller-Id`
            names one — capability is per seller.
          example:
          - read_products
          - write_products
      required:
      - user
      - sellers
      - permissions
      - permission_keys
    OnboardingProgress:
      type: object
      description: |
        How far along the checklist is — not how close to approval, since
        optional requirements count towards it too.

        Deliberately just the two counts. A percentage is arithmetic over
        them, which a client can do and which would otherwise be a second
        definition of the same fact.
      properties:
        done:
          type: integer
          example: 3
        total:
          type: integer
          example: 5
      required:
      - done
      - total
    SellerOnboardingResponse:
      type: object
      description: What the marketplace asks of this seller before it will admit them
      properties:
        status:
          type: string
          example: onboarding
          description: The seller's lifecycle status
        progress:
          "$ref": "#/components/schemas/OnboardingProgress"
        requirements:
          type: array
          items:
            "$ref": "#/components/schemas/RequirementStatus"
      required:
      - status
      - progress
      - requirements
    SellerCountry:
      type: object
      description: A country as the panel's address forms need it
      properties:
        iso:
          type: string
          example: US
        iso3:
          type: string
          example: USA
        name:
          type: string
          example: United States
        states_required:
          type: boolean
          example: true
        zipcode_required:
          type: boolean
          example: true
        states:
          type: array
          items:
            type: object
            properties:
              abbr:
                type: string
                example: CA
              name:
                type: string
                example: California
            required:
            - abbr
            - name
      required:
