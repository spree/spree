      description: |
        The product types a seller may list a product against.

        Read only. A type is the template that hands a product its option types
        and its delivery profile, so a seller picks one when listing; defining
        types is the marketplace's. Send the chosen `id` as `product_type_id`
        on the product.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: product types listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ProductType"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
  "/api/v3/seller/product_types/{id}":
    get:
      summary: Get a product type
      tags:
      - Product Types
      security:
      - bearer_auth: []
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Product type ID
        schema:
          type: string
      responses:
        '200':
          description: product type found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductType"
  "/api/v3/seller/products":
    get:
      summary: List products
      tags:
      - Products
      security:
      - bearer_auth: []
      description: |
        The seller's own catalog — the products they own outright.

        Every call is rooted in the acting seller server-side, so this can never
        return another seller's product or one the marketplace operator sells
        first-party.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: Sort field; prefix with `-` for descending
        schema:
          type: string
      responses:
        '200':
          description: products listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Product"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
                - meta
    post:
      summary: Create a product
      tags:
      - Products
      security:
      - bearer_auth: []
      description: |
        Creates a product owned by the acting seller.

        The seller and the store are taken from the request context whatever the
        payload says, so a product cannot be created against another seller.

        The operator's own settings — tax category, delivery profile and whether
        the product is promotionable — are not writable here; they belong to the
        marketplace, not the seller.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: product created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Hand-thrown mug
                description:
                  type: string
                slug:
                  type: string
                  example: hand-thrown-mug
                status:
                  type: string
                  example: draft
                meta_title:
                  type: string
                meta_description:
                  type: string
                meta_keywords:
                  type: string
                product_type_id:
                  type: string
                  example: ptype_abc123
                tags:
                  type: array
                  items:
                    type: string
                  example:
                  - ceramics
                  - handmade
                category_ids:
                  type: array
                  items:
                    type: string
                  example:
                  - cat_abc123
                metadata:
                  type: object
                  additionalProperties: true
                prices:
                  type: array
                  items:
                    type: object
                    properties:
                      amount:
                        type: string
                        example: '24.00'
                      compare_at_amount:
                        type: string
                        example: '30.00'
                      currency:
                        type: string
                        example: USD
              required:
              - name
  "/api/v3/seller/products/{id}":
    parameters:
    - name: id
      in: path
      description: Product ID
      required: true
      schema:
        type: string
    get:
      summary: Get a product
      tags:
      - Products
      security:
      - bearer_auth: []
      description: |
        A product the acting seller owns.

        An id belonging to another seller answers `404`, not `403` — the seller
        is not told the record exists.
      parameters:
      - name: X-Spree-Seller-Id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: product returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Product"
        '404':
