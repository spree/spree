                  quantity: 1
                  line_item_id: li_UkLWZg9DAJ
                  variant_id: variant_UkLWZg9DAJ
                  name: Product 149961
                  sku: SKU-191
                  options_text: ''
              schema:
                "$ref": "#/components/schemas/Fulfillment"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking:
                  type: string
                  description: Carrier tracking number
                tracking_carrier:
                  type: string
                  description: Carrier name
                notify_customer:
                  type: boolean
                  description: Send the dispatch email (default true)
                items:
                  type: array
                  description: Ship only these lines; the rest split onto a new fulfillment
                  items:
                    type: object
                    properties:
                      item_id:
                        type: string
                        description: Prefixed line item ID
                      quantity:
                        type: integer
                    required:
                    - item_id
                    - quantity
