  "/api/v3/store/collections/{collection_id}/products":
    get:
      summary: List collection products
      tags:
      - Product Catalog
      security:
      - api_key: []
      description: Products in the collection. Defaults to the collection's own sort
        order and accepts the same filters, sort, and pagination as the products endpoint.
      parameters:
      - name: x-spree-api-key
        in: header
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        required: true
        description: Collection permalink or prefix ID
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Sort order (e.g., price, -price). Defaults to the collection's
          sort_order.
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: products found
          content:
            application/json:
              example:
                data:
                - id: prod_UkLWZg9DAJ
                  name: Product 1576979
                  slug: product-1576979
                  meta_title:
                  meta_description:
