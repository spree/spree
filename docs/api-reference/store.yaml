                  meta_title:
                  meta_description:
                  meta_keywords:
                  products_count: 1
                  description: ''
                  description_html: ''
                  image_url:
                  square_image_url:
                meta:
                  page: 1
                  limit: 25
                  count: 1
                  pages: 1
                  from: 1
                  to: 1
                  in: 1
                  previous:
                  next:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Collection"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
        '401':
          description: unauthorized
          content:
            application/json:
              example:
                error:
                  code: invalid_token
                  message: Valid API key required
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v3/store/collections/{id}":
    get:
      summary: Get a collection
      tags:
      - Product Catalog
      security:
      - api_key: []
      description: Returns a single collection by permalink or prefix ID.
      parameters:
      - name: x-spree-api-key
        in: header
