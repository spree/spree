packages:
  - "packages/*"

# Supply-chain hardening — see https://pnpm.io/supply-chain-security
#
# minimumReleaseAge: delay installing newly-published versions of any
# dependency by 2 days (2880 minutes). pnpm 11 ships a 1-day default;
# we tighten it slightly. Catches malicious releases that get yanked
# from the registry within hours of publish without blocking ordinary
# upstream releases for a full week.
#
# blockExoticSubdeps: refuse transitive deps pulled from git URLs, raw
# tarballs, or other non-registry sources. Direct deps can still opt in
# explicitly; subdeps cannot smuggle one in. Default in pnpm 11 — pinned
# here to lock the behavior in case of future default changes.
#
# trustPolicy: fail the install if a package's trust level has dropped
# (e.g. previously signed releases now arriving without provenance).
# Defends against publisher takeover via leaked credentials.
#
# dangerouslyAllowAllBuilds: explicitly pinned to false. install scripts
# only run for packages approved via `pnpm approve-builds` — silently
# flipping this on would auto-run every dependency's postinstall.
minimumReleaseAge: 2880
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Versions the lockfile has always resolved but that published without the
# provenance an earlier release had. Excluding them lets a full re-resolution
# (pnpm update) accept the same versions again; it admits nothing new.
#   chokidar 4.0.3 — via tsup
#   semver 6.3.1   — via @babel/core 7, which every 7.x requires
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
dangerouslyAllowAllBuilds: false

# allowBuilds: per-package decision on whether install scripts run.
# dangerouslyAllowAllBuilds is off, so anything not explicitly listed
# here is silently skipped — and pnpm 11 fails the install if a needed
# build is skipped. Audit each package's install script before adding.
#
#   esbuild — downloads the platform-native binary on install
#   msw     — copies the service-worker shim into the workspace
allowBuilds:
  esbuild: true
  msw: true

# overrides: force patched versions of transitive packages flagged by
# security advisories. Dependabot cannot open these PRs itself — its
# npm_and_yarn updater chokes on pnpm's `workspace:` protocol during
# security-update resolution (dependabot-core#13177) — so we pin the
# fixes here. Revisit when the upstream dependents pull the fixes in on
# their own and these become no-ops.
overrides:
  # Base UI is pinned exactly, never caret-ranged: @spree/dashboard-ui ships
  # source, so whatever a consumer installs is compiled into their app by
  # their own Vite. A floating range means a scaffolded project builds against
  # a version nobody here tested.
  #
  # 1.8.0 resolves @base-ui/utils 0.4.0. Do not move below it: utils 0.2.x and
  # 0.3.x ship esm/store/useStore.js, which imports useSyncExternalStore BY
  # NAME from the CommonJS use-sync-external-store shim. Vite converts
  # CommonJS while prebundling an ordinary dependency, but an installed
  # dashboard-ui is source Vite does not crawl, so that file reaches the
  # browser unconverted and the dashboard dies with a SyntaxError. 0.4.0
  # dropped that ESM variant. Verify any change by installing the published
  # packages into the dashboard-starter template — the workspace symlink in
  # this repo hides the difference.
  '@base-ui/react': 1.8.0
  '@base-ui/utils': 0.4.0
  # react-redux 9.2.0 (transitive via recharts, whose range is 8.x || 9.x)
  # published without the provenance 9.1.0 had, so trustPolicy: no-downgrade
  # refuses it. 9.3.0 carries provenance again and is in range. Drop this once
  # recharts resolves 9.3+ on its own.
  react-redux: 9.3.0
  # Still load-bearing after the 2026-10 cleanup, when every security pin a
  # plain update makes redundant was dropped:
  #   esbuild        — vite 8 still resolves 0.27.x (GHSA-g7r4-m6w7-qqqr)
  #   read-yaml-file — changesets' @manypkg resolves read-yaml-file 1, whose
  #                    js-yaml 3 pulls a vulnerable sprintf-js; the 2.x line is
  #                    on js-yaml 4
  esbuild: ^0.28.1
  read-yaml-file: ^2.1.0
  # Fourth wave. A caret on @tiptap/core alone floated to 3.31.x while
  # @tiptap/react stayed on 3.22, which still imports cancelPositionCheck
  # and schedulePositionCheck — exports 3.31 removed. Pin the family
  # together on the patched line (prototype pollution <3.30.4, Markdown
  # ReDoS <3.30.5).
  '@tiptap/core': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/react': 3.31.3
  '@tiptap/starter-kit': 3.31.3
  '@tiptap/extensions': 3.31.3
  '@tiptap/extension-image': 3.31.3
  '@tiptap/extension-link': 3.31.3
  '@tiptap/extension-placeholder': 3.31.3
  # @tiptap/pm 3.31 wants prosemirror-model ^1.25.11 and prosemirror-view
  # ^1.42.3, but schema-list/state still resolve the older 1.25.4 / 1.41.8
  # line. Two copies make wrapInList throw, so list toolbar buttons no-op.
  prosemirror-model: 1.25.11
  prosemirror-view: 1.42.3

# auditConfig: advisories we have reviewed and decided not to fix. The weekly
# security-audit workflow honors this list, so an entry here also stops the job
# from re-proposing the same pin every week.
#
#   braces (GHSA-vfj7-8cjw-p6xm, high) — the advisory names 3.0.4 as the fix,
#   but 3.0.4 is not published on npm, so there is nothing to move to. Reached
#   only through @changesets/cli's globbing over our own repository files.
#   Review by 2026-11-22, or as soon as braces 3.0.4 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@tiptap/core@3.31.3'
  - '@tiptap/pm@3.31.3'
  - '@tiptap/react@3.31.3'
  - '@tiptap/starter-kit@3.31.3'
  - '@tiptap/extensions@3.31.3'
  - '@tiptap/extension-image@3.31.3'
  - '@tiptap/extension-link@3.31.3'
  - '@tiptap/extension-placeholder@3.31.3'
  - prosemirror-model@1.25.11
  - prosemirror-view@1.42.3
