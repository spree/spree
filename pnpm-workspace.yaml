packages:
  - "packages/*"

# Supply-chain hardening — see https://pnpm.io/supply-chain-security
#
# minimumReleaseAge: delay installing newly-published versions of any
# dependency by 2 days (2880 minutes). pnpm 11 ships a 1-day default;
# we tighten it slightly. Catches malicious releases that get yanked
# from the registry within hours of publish without blocking ordinary
# upstream releases for a full week.
#
# blockExoticSubdeps: refuse transitive deps pulled from git URLs, raw
# tarballs, or other non-registry sources. Direct deps can still opt in
# explicitly; subdeps cannot smuggle one in. Default in pnpm 11 — pinned
# here to lock the behavior in case of future default changes.
#
# trustPolicy: fail the install if a package's trust level has dropped
# (e.g. previously signed releases now arriving without provenance).
# Defends against publisher takeover via leaked credentials.
#
# dangerouslyAllowAllBuilds: explicitly pinned to false. install scripts
# only run for packages approved via `pnpm approve-builds` — silently
# flipping this on would auto-run every dependency's postinstall.
minimumReleaseAge: 2880
blockExoticSubdeps: true
trustPolicy: no-downgrade
dangerouslyAllowAllBuilds: false

# allowBuilds: per-package decision on whether install scripts run.
# dangerouslyAllowAllBuilds is off, so anything not explicitly listed
# here is silently skipped — and pnpm 11 fails the install if a needed
# build is skipped. Audit each package's install script before adding.
#
#   esbuild — downloads the platform-native binary on install
#   msw     — copies the service-worker shim into the workspace
allowBuilds:
  esbuild: true
  msw: true

# overrides: force patched versions of transitive packages flagged by
# security advisories. Dependabot cannot open these PRs itself — its
# npm_and_yarn updater chokes on pnpm's `workspace:` protocol during
# security-update resolution (dependabot-core#13177) — so we pin the
# fixes here. Revisit when the upstream dependents pull the fixes in on
# their own and these become no-ops.
overrides:
  # Base UI is held at 1.5.0 deliberately, not merely pinned. @base-ui/react
  # 1.6.0 moved to @base-ui/utils 0.3.x, which added a `useStore` helper
  # importing `useSyncExternalStore` by NAME from the CommonJS
  # `use-sync-external-store` shim. Vite converts CommonJS while prebundling a
  # dependency, but @spree/dashboard-ui ships source: in this repo it is a
  # workspace link Vite crawls as app source, while an installed copy sits in
  # node_modules and is not crawled, so that file reaches the browser with the
  # named CommonJS import intact and the dashboard dies with a SyntaxError
  # before rendering. 1.5.0 pins utils 0.2.9, which has no such file.
  #
  # Only a scaffolded app reproduces this — the monorepo cannot, because of
  # the workspace link. Verify any bump by scaffolding a project, never by
  # running the starter here.
  '@base-ui/react': 1.5.0
  '@base-ui/utils': 0.2.9
  # react-redux 9.2.0 (transitive via recharts, whose range is 8.x || 9.x)
  # published without the provenance 9.1.0 had, so trustPolicy: no-downgrade
  # refuses it. 9.3.0 carries provenance again and is in range. Drop this once
  # recharts resolves 9.3+ on its own.
  react-redux: 9.3.0
  esbuild: ^0.28.1
  vite: ^8.0.16
  js-yaml: ^4.3.2
  # js-yaml ^4 drops the safeLoad API that read-yaml-file@1 calls; bump
  # read-yaml-file (transitive via changesets) to its js-yaml-4 line so
  # the js-yaml pin above doesn't break the release tooling.
  read-yaml-file: ^2.1.0
  # Second wave, flagged by the weekly audit workflow. All single-version
  # in the tree, all same-major bumps — no API breakage.
  #   rollup         — path-traversal arbitrary file write (transitive via tsup)
  #   hono           — CORS/cookie/path-traversal cluster (transitive via shadcn's MCP SDK)
  #   qs             — DoS in qs.stringify (transitive via shadcn's MCP SDK -> express)
  #   brace-expansion — ReDoS bypassing the documented max guard (transitive via shadcn -> ts-morph)
  rollup: ^4.59.0
  hono: ^4.13.5
  qs: ^6.16.0
  brace-expansion: ^5.0.9
  # Third wave. Each of these resolves to a single version line in the tree,
  # so a plain caret pin is enough — no per-advisory range keys needed.
  #   nanoid          — unbounded loop on a negative or zero size
  #   postcss         — source-map path traversal reads arbitrary .map files
  #   fast-uri        — host confusion via backslash/IDN authority parsing
  #   ip-address      — octal/IPv4-mapped parsing gaps that bypass SSRF checks
  #   body-parser     — invalid limit value silently disables the size cap
  #   @hono/node-server — serve-static path traversal on Windows via %5C
  nanoid: ^3.3.18
  postcss: ^8.5.23
  fast-uri: ^3.1.6
  ip-address: ^10.3.1
  body-parser: ^2.3.0
  '@hono/node-server': ^1.19.15
  # Fourth wave. A caret on @tiptap/core alone floated to 3.31.x while
  # @tiptap/react stayed on 3.22, which still imports cancelPositionCheck
  # and schedulePositionCheck — exports 3.31 removed. Pin the family
  # together on the patched line (prototype pollution <3.30.4, Markdown
  # ReDoS <3.30.5).
  '@tiptap/core': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/react': 3.31.3
  '@tiptap/starter-kit': 3.31.3
  '@tiptap/extensions': 3.31.3
  '@tiptap/extension-image': 3.31.3
  '@tiptap/extension-link': 3.31.3
  '@tiptap/extension-placeholder': 3.31.3
  # @tiptap/pm 3.31 wants prosemirror-model ^1.25.11 and prosemirror-view
  # ^1.42.3, but schema-list/state still resolve the older 1.25.4 / 1.41.8
  # line. Two copies make wrapInList throw, so list toolbar buttons no-op.
  prosemirror-model: 1.25.11
  prosemirror-view: 1.42.3
  '@vitest/mocker': ^4.1.11
  baseline-browser-mapping: ^2.11.0
  browserslist: ^4.28.7
  postcss-selector-parser: ^7.1.3
  vitest: ^4.1.11

# auditConfig: advisories we have reviewed and decided not to fix. The weekly
# security-audit workflow honors this list, so an entry here also stops the job
# from re-proposing the same pin every week.
#
#   @babel/core (GHSA-4x5r-pxfx-6jf8, low) — patched in 7.29.6, but pinning it
#   fails the install outright: our consumers (shadcn, @tanstack/router-plugin)
#   require @babel/core ^7, every 7.x needs semver@^6.3.1, and 6.3.1 is the only
#   6.x satisfying that. It published without the provenance its predecessors
#   had, so trustPolicy: no-downgrade rejects it — verified, not assumed. Moving
#   to @babel/core 8 (which uses semver@^7) would break both consumers.
#   Build-time only and needs an attacker-controlled source map to exploit.
#   Owner: @damianlegawiec. Review by 2026-11-22, or sooner if either consumer
#   widens its range to @babel/core 8 or semver@6.3.1 regains provenance.
auditConfig:
  ignoreGhsas:
    - GHSA-4x5r-pxfx-6jf8

minimumReleaseAgeExclude:
  - postcss-selector-parser@7.1.3
  - browserslist@4.28.7
  - qs@6.16.0
  - fast-uri@3.1.6
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0
  - js-yaml@4.3.2
  - hono@4.13.5
  - '@tiptap/core@3.31.3'
  - '@tiptap/pm@3.31.3'
  - '@tiptap/react@3.31.3'
  - '@tiptap/starter-kit@3.31.3'
  - '@tiptap/extensions@3.31.3'
  - '@tiptap/extension-image@3.31.3'
  - '@tiptap/extension-link@3.31.3'
  - '@tiptap/extension-placeholder@3.31.3'
  - prosemirror-model@1.25.11
  - prosemirror-view@1.42.3
