version: 2
updates:
  # Ruby gems — every engine that ships its own Gemfile/gemspec.
  - package-ecosystem: bundler
    directories:
      - "/spree/core"
      - "/spree/api"
      - "/spree/dashboard"
      - "/spree/emails"
      - "/spree/opentelemetry"
      - "/spree/providers/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruby-gems:
        patterns:
          - "*"

  # GitHub Actions — pinned by commit SHA across our workflows, so without
  # this they never move, including for security releases.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # JavaScript/TypeScript (pnpm workspace — single root lockfile)
  #
  # Heads up: do not rely on Dependabot for vulnerable *transitive* npm
  # dependencies, which is nearly every advisory we get. It rejected them
  # outright until dependabot-core#13177 closed; the replacement (#14589) falls
  # back to `pnpm audit --fix` but sits behind the `enable_audit_fix_fallback`
  # flag, so we cannot count on it running. When it does run, #15104 is still
  # open: it rewrites lockfile `specifier:` entries without the matching
  # package.json change, which our frozen-lockfile CI rejects.
  #
  # So those fixes are pinned via `overrides:` in pnpm-workspace.yaml by the
  # weekly `.github/workflows/security-audit.yml` job. Keep that workflow as
  # the fallback even if Dependabot starts opening some of these PRs; revisit
  # only once #15104 is fixed and the flag is on by default.
  #
  # The direct-dependency version updates below are unaffected. `cooldown`
  # mirrors the `minimumReleaseAge` in pnpm-workspace.yaml — without it
  # Dependabot proposes versions that pnpm then refuses to install.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      typescript-packages:
        patterns:
          - "*"
