name: Preview packages

# Publishes the SDKs, @spree/core and the dashboard packages to pkg.pr.new for
# every pull request and every push to main, so an unreleased fix can be
# installed without cutting a release:
#
#   pnpm add https://pkg.pr.new/@spree/dashboard@<pull request number>
#   pnpm add https://pkg.pr.new/@spree/dashboard@<commit sha>
#
# Regular dependencies between previews (such as @spree/core) point at the
# preview from the same run. Peer dependencies keep their npm ranges, so add
# every Spree peer from the same run too (for @spree/dashboard: dashboard-core,
# dashboard-ui and admin-sdk), or the released versions from npm are installed.
# pnpm 11 blocks dependencies pulled from tarball URLs, so the installing app
# needs `blockExoticSubdeps: false` while it uses previews. The pkg.pr.new
# GitHub App must be installed on the repository; it posts the install
# commands as a comment on the pull request.
on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/preview-packages.yml'
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main every commit keeps its own preview, so only pull requests cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish preview packages
    # A fork's code would be published under the @spree names without review.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PACKAGES: >-
        core sdk admin-sdk seller-sdk
        dashboard-ui dashboard-core dashboard seller-dashboard dashboard-sentry
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Restores the Turbo cache the frontend workflow saves for this commit.
      - uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --cache-dir=.turbo $(printf -- '--filter=./packages/%s ' $PACKAGES)

      # --pnpm packs with `pnpm pack`, which writes out the workspace: and
      # catalog: ranges that npm would ship verbatim.
      - name: Publish to pkg.pr.new
        run: pnpm dlx pkg-pr-new@0.0.93 publish --pnpm --packageManager=pnpm,npm $(printf -- './packages/%s ' $PACKAGES)
