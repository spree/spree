name: Packages

on:
  push:
    branches: [main, '6-0-dev']
    paths:
      - "packages/**"
      - "spree/api/app/**"
      - "spree/core/app/**"
      - "docs/developer/**"
      - "docs/api-reference/**"
      - "docs/integrations/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - "scripts/sync-starter.mjs"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "spree/api/app/**"
      - "spree/core/app/**"
      - "docs/developer/**"
      - "docs/api-reference/**"
      - "docs/integrations/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "biome.json"
      - "scripts/sync-starter.mjs"
      - ".github/workflows/packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: "Typecheck, Test & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Persist Turbo's local cache across runs. Turbo hashes each task by its
      # inputs, so unchanged packages restore their lint/typecheck/test/build
      # results instead of recomputing them cold on every run. The key rotates
      # by run id; restore-keys falls back to the most recent prior cache.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The pre-commit hook regenerates schemas, but it can be skipped or not
      # installed, so a commit can still carry types without matching schemas.
      - name: Check Zod schemas are up to date
        run: |
          pnpm generate:zod
          if [ -n "$(git status --porcelain -- 'packages/*/src/zod/generated/*')" ]; then
            git status --short -- 'packages/*/src/zod/generated/*'
            git diff -- 'packages/*/src/zod/generated/*'
            echo "::error::Zod schemas are out of date. Run 'pnpm generate:zod' and commit the result."
            exit 1
          fi

      # Filter types come from the filter tables in docs/api-reference, which
      # swaggerize writes from the model allowlists.
      - name: Check SDK filter types are up to date
        run: |
          pnpm generate:filters
          if [ -n "$(git status --porcelain -- 'packages/*/src/types/filters.generated.ts')" ]; then
            git diff -- 'packages/*/src/types/filters.generated.ts'
            echo "::error::SDK filter types are out of date. Run 'pnpm generate:filters' and commit the result."
            exit 1
          fi

      - run: pnpm turbo lint typecheck test build --cache-dir=.turbo

  # Creates a new project with create-spree-app the way a user would, but from
  # this commit's packages instead of the ones on npm, and checks that the
  # generated Dashboard and Seller Panel build, typecheck and lint cleanly.
  # The monorepo's own checks can't catch this: inside the workspace every
  # @spree/* package is a symlink resolved under the root overrides, while a
  # generated app installs packed tarballs on its own.
  scaffolded-app:
    name: "Scaffolded app - Typecheck & Lint"
    runs-on: ubuntu-latest
    steps:
      # Runs the pull request's install and build scripts; nothing needs an
      # authenticated git afterwards.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Same Turbo cache as the check job.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --cache-dir=.turbo

      # `pnpm pack` rewrites workspace: ranges to real versions, exactly as
      # `pnpm publish` does in the release jobs below.
      - name: Pack packages
        run: |
          for pkg in admin-sdk seller-sdk dashboard-ui dashboard-core dashboard seller-dashboard cli; do
            pnpm --dir "packages/$pkg" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done

      # Outside the checkout, so the project doesn't join this pnpm workspace.
      # SPREE_CLI_VERSION points the project at the packed CLI, which carries
      # the starter templates the apps are created from.
      - name: Create project
        run: |
          CLI_TARBALL=$(ls "$RUNNER_TEMP"/tarballs/spree-cli-*.tgz)
          SPREE_CLI_VERSION="file:$CLI_TARBALL" node packages/create-spree-app/dist/index.js "$RUNNER_TEMP/app" \
            --no-start --no-storefront --seller-dashboard --use-pnpm

      # The apps pin @spree/* to npm ranges. Overriding every package with its
      # tarball also replaces the copies other @spree/* packages depend on.
      - name: Point the apps at the packed packages
        run: |
          {
            echo "overrides:"
            for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
              NAME=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
              echo "  '$NAME': 'file:$tarball'"
            done
          } > "$RUNNER_TEMP/overrides.yaml"
          cat "$RUNNER_TEMP/overrides.yaml"

      - name: Check Dashboard
        working-directory: ${{ runner.temp }}/app/apps/dashboard
        run: |
          cat "$RUNNER_TEMP/overrides.yaml" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm build && pnpm typecheck && pnpm lint

      - name: Check Seller Panel
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/app/apps/seller-dashboard
        run: |
          cat "$RUNNER_TEMP/overrides.yaml" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm build && pnpm typecheck && pnpm lint

  sdk-integration:
    name: "SDK Integration Tests"
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DB: sqlite3
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: spree/api

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK dependencies
        run: pnpm turbo build --filter=@spree/sdk-core

      - name: Setup test app
        working-directory: spree/api
        run: bundle exec rake test_app

      - name: Run SDK integration tests
        working-directory: packages/sdk
        run: pnpm test:integration

  dashboard-e2e:
    name: "Dashboard - E2E (${{ matrix.shard }}/4)"
    runs-on: ubuntu-latest
    # Each shard is a full isolated stack (own Rails + SQLite + Vite), so
    # shards can't interfere through shared server state the way parallel
    # workers against one backend would. Playwright distributes spec files
    # across shards; within a shard the suite stays serial (workers: 1).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RAILS_ENV: test
      DB: sqlite3
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: spree/api

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Same Turbo cache as the check job — unchanged packages restore their
      # build outputs instead of rebuilding per shard.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Build the dashboard and its workspace deps (sdk-core, admin-sdk,
      # dashboard-core/-ui via ^build). The E2E suite runs against the built
      # SPA (`vite preview`, E2E_PREVIEW below): fresh browser contexts have
      # empty caches, so the dev server would re-serve hundreds of on-demand
      # modules on every page load in every test.
      #
      # The seller panel is served alongside it, because accepting a seller
      # invitation happens there rather than in the dashboard. Its starter's
      # vite config imports `@spree/seller-dashboard/vite`, which resolves to
      # that package's `dist/`, so it must be built even to load the config.
      - name: Build dashboard packages
        run: pnpm turbo build --filter=@spree/dashboard --filter=@spree/seller-dashboard-starter --cache-dir=.turbo

      - name: Setup dummy Rails app
        working-directory: spree/api
        run: bundle exec rake test_app

      # Cache the chromium download (~85MB). The cache key tracks the
      # Playwright version pinned in lockfile, so a bump auto-invalidates.
      - name: Read Playwright version
        id: playwright
        run: |
          VERSION=$(node -p "require('./packages/dashboard/node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/dashboard
        run: pnpm exec playwright install --with-deps chromium

      # Even on a cache hit Playwright still wants the OS-level deps installed
      # (libnss, libxkbcommon, …). `install-deps` is the cheap part.
      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/dashboard
        run: pnpm exec playwright install-deps chromium

      - name: Run dashboard E2E tests
        working-directory: packages/dashboard
        env:
          E2E_PREVIEW: "1"
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      # First-run setup needs a stack with no admin, which the main suite's
      # never has — it brings up its own Rails and database. One shard is
      # enough; it runs even when the main suite failed.
      - name: Run first-run setup E2E tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: packages/dashboard
        env:
          E2E_PREVIEW: "1"
        run: pnpm test:e2e:first-run

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            packages/dashboard/playwright-report/
            packages/dashboard/test-results/
            packages/dashboard/playwright-report-first-run/
            packages/dashboard/test-results-first-run/
          retention-days: 14

  # Stable single-status roll-up of the shard matrix, keeping the check name
  # branch-protection rules and status badges can pin against.
  dashboard-e2e-result:
    name: "Dashboard - E2E"
    needs: dashboard-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.dashboard-e2e.result }}" != "success" ]; then
            echo "One or more E2E shards did not succeed: ${{ needs.dashboard-e2e.result }}"
            exit 1
          fi
          echo "All E2E shards passed."

  release-sdk:
    name: "SDK - Release"
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Check if version is published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view @spree/sdk@$PACKAGE_VERSION version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      # @spree/sdk is the one package with a stable `latest` that real
      # storefronts already depend on (`^1.2.1` = the 5.x Store API). A 6.0
      # prerelease published without a tag would land on `latest` and be
      # resolved by every one of them on their next install, so the tag is
      # load-bearing here rather than a nicety.
      - name: Determine npm tag
        id: tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if echo "$PACKAGE_VERSION" | grep -qE '^0\.'; then
            echo "tag=next" >> $GITHUB_OUTPUT
          elif echo "$PACKAGE_VERSION" | grep -qE '[-]'; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Publish
        if: steps.check.outputs.published == 'false'
        run: pnpm turbo build --filter=@spree/sdk && npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}

  release-admin-sdk:
    name: "Admin SDK - Release"
    needs: [check, scaffolded-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: packages/admin-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Check if version is published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view @spree/admin-sdk@$PACKAGE_VERSION version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine npm tag
        id: tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # Pre-1.0 / Developer Preview releases ship under the `next` tag so
          # `npm install @spree/admin-sdk` doesn't pick them up as `latest`.
          if echo "$PACKAGE_VERSION" | grep -qE '^0\.'; then
            echo "tag=next" >> $GITHUB_OUTPUT
          elif echo "$PACKAGE_VERSION" | grep -qE '[-]'; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Publish
        if: steps.check.outputs.published == 'false'
        run: pnpm turbo build --filter=@spree/admin-sdk && npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}

  release-cli:
    name: "CLI - Release"
    # Gated on release-dashboard and release-seller: the CLI tarball embeds the
    # dashboard-starter AND seller-dashboard-starter templates with floating
    # ranges floored at the @spree/dashboard{,-ui,-core} and @spree/seller-*
    # versions being released — publishing it before those versions exist on
    # npm would ship a scaffold whose install fails until they land.
    needs: [check, scaffolded-app, release-dashboard, release-seller]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Check if version is published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view @spree/cli@$PACKAGE_VERSION version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine npm tag
        id: tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if echo "$PACKAGE_VERSION" | grep -qE '[-]'; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      # Build the CLI with its workspace deps first. The CLI bundles
      # @spree/admin-sdk (tsup `noExternal: [/.*/]`), so esbuild must resolve
      # that package's `dist/` at build time. A bare `pnpm build` only builds
      # the CLI; `turbo build --filter` follows the `^build` graph and builds
      # @spree/admin-sdk first (matching the SDK release jobs above).
      - name: Build
        if: steps.check.outputs.published == 'false'
        run: pnpm turbo build --filter=@spree/cli
        working-directory: .

      # Use `pnpm publish`, not `npm publish`: the CLI keeps @spree/admin-sdk as a
      # `workspace:` devDependency, which `npm publish` would ship to the registry
      # verbatim (EUNSUPPORTEDPROTOCOL on install). `pnpm publish` rewrites the
      # `workspace:` protocol to the resolved semver range while packing.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: pnpm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }} --no-git-checks

  # The dashboard packages are source-only for everything the host's Vite
  # compiles, but their Node-side Vite-plugin entries are compiled to JS by a
  # per-package prepublishOnly hook (Node refuses to type-strip .ts under
  # node_modules). They depend on each other via workspace:^, which
  # `pnpm publish` rewrites to the concrete ^x.y.z while packing — so they
  # publish in dependency order from a single job. Pre-1.0 Developer Preview versions ship under the `next` tag,
  # matching @spree/admin-sdk.
  release-dashboard:
    name: "Dashboard packages - Release"
    # Gated on release-admin-sdk: the dashboard packages' workspace:^ ranges
    # are rewritten to concrete ^x.y.z of @spree/admin-sdk while packing — a
    # same-push admin-sdk version bump must land on npm first, or installs of
    # the just-published dashboard packages fail until it does. (release-cli
    # waits on this job, completing the admin-sdk → dashboard → cli chain.)
    needs: [check, scaffolded-app, release-admin-sdk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # As in the seller job: prepublishOnly compiles the Vite-plugin entries
      # with tsup, so the workspace dependency graph must be built first.
      - name: Build
        run: pnpm turbo build --filter=@spree/dashboard

      - name: Publish unpublished versions (dependency order)
        run: |
          set -euo pipefail
          for pkg in dashboard-ui dashboard-core dashboard; do
            cd "packages/$pkg"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "$NAME@$VERSION" version 2>/dev/null; then
              echo "$NAME@$VERSION already published — skipping."
            else
              if echo "$VERSION" | grep -qE '^0\.'; then TAG=next
              elif echo "$VERSION" | grep -qE '[-]'; then TAG=beta
              else TAG=latest
              fi
              echo "Publishing $NAME@$VERSION with tag $TAG..."
              pnpm publish --provenance --access public --tag "$TAG" --no-git-checks
            fi
            cd ../..
          done

  # The seller packages mirror the admin pair above: @spree/seller-sdk is the
  # Seller API client, @spree/seller-dashboard the panel built on it. They
  # publish on the same pre-1.0 `next` scheme, in dependency order, and must
  # land before release-cli — the CLI tarball embeds the seller-dashboard
  # starter with ranges floored at these versions.
  release-seller:
    name: "Seller packages - Release"
    needs: [check, scaffolded-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Each package's prepublishOnly runs tsup while packing, and tsup bundles
      # its workspace dependencies from their dist/ — @spree/seller-sdk pulls
      # in the private @spree/sdk-core, which nothing has built yet in a fresh
      # checkout. Build the graph first; `--filter` follows ^build, exactly as
      # the SDK and CLI release jobs do.
      - name: Build
        run: pnpm turbo build --filter=@spree/seller-sdk --filter=@spree/seller-dashboard

      - name: Publish unpublished versions (dependency order)
        run: |
          set -euo pipefail
          for pkg in seller-sdk seller-dashboard; do
            cd "packages/$pkg"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "$NAME@$VERSION" version 2>/dev/null; then
              echo "$NAME@$VERSION already published — skipping."
            else
              if echo "$VERSION" | grep -qE '^0\.'; then TAG=next
              elif echo "$VERSION" | grep -qE '[-]'; then TAG=beta
              else TAG=latest
              fi
              echo "Publishing $NAME@$VERSION with tag $TAG..."
              pnpm publish --provenance --access public --tag "$TAG" --no-git-checks
            fi
            cd ../..
          done

  # The dashboard-starter template is NOT distributed via a template repo:
  # `@spree/cli` and `create-spree-app` embed it at build time
  # (scripts/sync-starter.mjs renders packages/dashboard-starter
  # with floating ranges floored at the released versions into their
  # templates/ dir), so scaffolds install the newest dashboard release even
  # from an older CLI, and never anything older than the template was built
  # against.

  release-create-spree-app:
    name: "create-spree-app - Release"
    # Gated on release-cli: the dashboard scaffold phase delegates to the
    # project-local `spree add dashboard`, so a create-spree-app that offers
    # the dashboard must not publish before the CLI implementing that command
    # (with the embedded starter) is on npm. Completes the release chain:
    # admin-sdk → dashboard → cli → create-spree-app.
    needs: [check, scaffolded-app, release-cli]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: packages/create-spree-app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Trusted Publishing requires npm >= 11.5.1, but the bundled npm
      # on Node 22 is 10.9.7. A plain `npm install -g npm@latest` swaps
      # npm's own files in place and the in-flight install can't find
      # its own dependencies (MODULE_NOT_FOUND: promise-retry). Install
      # to a separate prefix and prepend to PATH instead.
      - name: Upgrade npm for Trusted Publishing support
        run: |
          npm install -g npm@latest --prefix="$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Check if version is published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view create-spree-app@$PACKAGE_VERSION version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      # Stable today, but a prerelease must never become the default for
      # `npx create-spree-app` — the entry point every new project runs.
      - name: Determine npm tag
        id: tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if echo "$PACKAGE_VERSION" | grep -qE '[-]'; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and Publish
        if: steps.check.outputs.published == 'false'
        run: pnpm build && npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
