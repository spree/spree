name: MCP Registry

# Publishes the store's MCP server entry (.github/mcp-registry/server.json) to
# the official MCP Registry with the version of each Spree release, so the
# registry and the catalogs that copy it (Glama, GitHub's MCP list) always show
# the latest release. The version in the file is a placeholder; the release
# tag sets it.
#
# Signs in with GitHub OIDC, so it needs no token or secret: the registry
# accepts this repository for the io.github.spree namespace.
# https://modelcontextprotocol.io/registry/github-actions
#
# A release created with the workflow's token starts no workflow, so
# scripts/release/publish-on-merge.mjs starts this one for patch releases, as it
# does discord-release.yml. Releases published by a person start it themselves.
# Prereleases, drafts, @spree/cli and create-spree-app releases are skipped.
run-name: Publish ${{ github.event.release.tag_name || inputs.tag }} to the MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v6.0.6
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the MCP Registry
    if: >-
      startsWith(github.event.release.tag_name || inputs.tag, 'v') &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Read the entry from the default branch, never from the release tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/mcp-registry/server.json
          sparse-checkout-cone-mode: false

      - name: Check the release and set the version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "::notice::$1"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || skip "$TAG is not a final release, so nothing is published."
          # A run by hand names a tag: publish only a published, final release.
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease) \
            || { echo "::error::$TAG has no published GitHub release."; exit 1; }
          [[ $(jq -r '.isDraft or .isPrerelease' <<<"$release") == false ]] \
            || skip "$TAG is a draft or a prerelease, so nothing is published."
          version="${TAG#v}"
          name=$(jq -r .name .github/mcp-registry/server.json)
          entry="https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version"
          echo "ENTRY=$entry" >> "$GITHUB_ENV"
          # An earlier run may already have published it; re-running then succeeds.
          curl -fsS -o /dev/null "$entry" && skip "$name $version is already in the MCP Registry."
          jq --arg v "$version" '.version = $v' .github/mcp-registry/server.json > server.json
          echo "Publishing $name $version"

      - name: Install mcp-publisher
        if: env.SKIP != '1'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Sign in with GitHub OIDC
        if: env.SKIP != '1'
        run: ./mcp-publisher login github-oidc

      # If the registry took the entry but the answer was lost, the entry is
      # there and the run counts as done.
      - name: Publish
        if: env.SKIP != '1'
        run: |
          ./mcp-publisher publish server.json && exit 0
          curl -fsS -o /dev/null "$ENTRY" && echo "::notice::The registry has the entry, so it is published." && exit 0
          exit 1
