name: Docs Package

# Checks that the docs package builds. It is published with each Spree release,
# by release.yml on the v<version> tag, under the Spree version.

on:
  push:
    branches: [main]
    paths:
      - "docs/developer/**"
      - "docs/api-reference/**"
      - "docs/integrations/**"
      - "packages/docs/**"
  pull_request:
    paths:
      - "docs/developer/**"
      - "docs/api-reference/**"
      - "docs/integrations/**"
      - "packages/docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @spree/docs build

      - name: Verify output
        run: |
          FILE_COUNT=$(find packages/docs/dist -name "*.md" | wc -l)
          echo "Built $FILE_COUNT markdown files"
          if [ "$FILE_COUNT" -lt 100 ]; then
            echo "Expected at least 100 files, got $FILE_COUNT"
            exit 1
          fi
