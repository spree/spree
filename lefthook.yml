pre-commit:
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc}"
      stage_fixed: true
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typelizer-and-zod:
      glob:
        - "spree/api/app/serializers/**/*.rb"
        - "spree/api/lib/spree/api/webhook_event_types.rb"
        - "spree/emails/app/serializers/**/*.rb"
        - "spree/core/app/serializers/spree/emails/**/*.rb"
        - "spree/*/config/initializers/typelizer.rb"
      run: |
        echo "Serializer changes detected — regenerating TypeScript types and Zod schemas..."
        cd spree/api && bundle exec rake typelizer:generate && cd ../..
        pnpm generate:zod
        git add packages/sdk/src/types/generated/ packages/sdk/src/zod/generated/ packages/sdk/src/webhooks/generated/
        git add packages/admin-sdk/src/types/generated/ packages/admin-sdk/src/zod/generated/
        git add packages/seller-sdk/src/types/generated/ packages/seller-sdk/src/zod/generated/
    zod:
      # Types regenerated or edited without a serializer change, and changes to
      # the generator itself, still need fresh schemas.
      glob:
        - "packages/*/src/types/generated/*.ts"
        - "packages/sdk-core/scripts/generate-zod.ts"
      run: |
        pnpm generate:zod
        git add packages/sdk/src/zod/generated/ packages/admin-sdk/src/zod/generated/ packages/seller-sdk/src/zod/generated/

    filters:
      # The API reference carries the filter tables; regenerating it, or
      # changing the generator, needs fresh SDK filter types.
      glob:
        - "docs/api-reference/{store,admin,seller}.yaml"
        - "packages/sdk-core/scripts/generate-filters.ts"
      run: |
        pnpm generate:filters
        git add packages/sdk/src/types/filters.generated.ts packages/admin-sdk/src/types/filters.generated.ts packages/seller-sdk/src/types/filters.generated.ts

pre-push:
  commands:
    biome-ci:
      # No glob filter: biome ci scopes itself via --changed --since=main to
      # validate the whole branch diff vs main. A glob would skip the check
      # whenever a push touched zero TS files (e.g. Ruby-only follow-up push),
      # missing TS issues from earlier commits already in the branch.
      run: pnpm exec biome ci --changed --since=main --no-errors-on-unmatched --files-ignore-unknown=true
