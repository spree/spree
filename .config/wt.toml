# worktrunk project config — see CLAUDE.md "Worktrees" and scripts/worktree/.
# pre-start blocks worktree creation until the environment (server/, database,
# deps) exists, so `wt switch -c foo -x claude` lands agents in a working tree.
# Both hooks are declared as top-level keys: a bare key after a [table] header
# would belong to that table, turning teardown into a second create hook.
#
# The guards keep worktrees branched from a base that predates these scripts
# usable — the hook skips instead of failing worktree creation or removal.

pre-start = "test -x scripts/worktree/setup.sh && scripts/worktree/setup.sh '{{ branch }}' || echo 'scripts/worktree/setup.sh not on this branch — provision manually'"

post-remove = "test -x scripts/worktree/teardown.sh && scripts/worktree/teardown.sh '{{ branch }}' || true"
