# yaml-language-server: $schema=../../schemas/spree-config.json
#
# Sample data, step 1: what must exist before the products are imported.
# The product CSV names its product types, option types and custom fields, so
# they are declared here first; the delivery methods, payment methods and the
# promotion complete a store someone can check out on.
#
# Variables: ${STORE_CURRENCY}.
version: 1

channels:
  # Beside the online store and the wholesale channel every store starts with.
  - code: pos
    name: Point of Sale

option_types:
  # The product CSV brings each product's colors.
  - name: color
    label: Color
    kind: color_swatch
  # New, refurbished or used: an option, so one listing can carry a new and a
  # used offer side by side.
  - name: condition
    label: Condition
    kind: buttons
    filterable: true
    values:
      - name: new
        label: New
      - name: refurbished
        label: Refurbished
      - name: used
        label: Used

custom_field_definitions:
  - { resource_type: product, key: warranty, field_type: short_text }
  - { resource_type: product, key: capacity, field_type: short_text }
  - { resource_type: product, key: voltage, field_type: short_text }
  - { resource_type: product, key: wattage, field_type: short_text }
  - { resource_type: product, key: runtime, field_type: short_text }
  - { resource_type: product, key: room_coverage, field_type: short_text }
  - { resource_type: product, key: noise_level, field_type: short_text }
  - { resource_type: product, key: connectivity, field_type: short_text }

# Each type shows the electrical basics, then the fields its category needs.
# `required` marks a field in the product form; nothing rejects a blank one.
product_types:
  - name: Kitchen Appliance
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
      - { key: capacity }
  # Purifiers and humidifiers treat a room, fans only move air, so room
  # coverage is optional here.
  - name: Air Treatment
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
      - { key: room_coverage }
      - { key: capacity }
      - { key: noise_level }
      - { key: connectivity }
  - name: Garment Care
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
      - { key: capacity }
  - name: Vacuum Cleaner
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
      - { key: runtime }
      - { key: connectivity }
  - name: Hair Styling
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
  - name: Grooming
    option_types: [color]
    custom_fields:
      - { key: wattage, required: true }
      - { key: voltage, required: true }
      - { key: warranty, required: true }
      - { key: runtime, required: true }

# Wholesale packaging: the carton products are packed into, and the pallet
# those cartons stack onto.
package_types:
  - name: Master carton
    kind: carton
    length: 40
    width: 30
    height: 25
    weight: 0.4
    max_weight: 20
    dimensions_unit: cm
    weight_unit: kg
  - name: Euro pallet
    kind: pallet
    length: 120
    width: 80
    height: 15
    weight: 25
    max_weight: 1500
    dimensions_unit: cm
    weight_unit: kg

# Beside the Standard and International methods every store starts with.
delivery_methods:
  - name: Express
    delivery_zone: Domestic
    calculator:
      type: flat_rate
      preferences:
        amount: 15
        currency: ${STORE_CURRENCY}
  # Free above a spend threshold, hidden below it.
  - name: Free International Shipping
    delivery_zone: International
    calculator:
      type: flat_rate
      preferences:
        amount: 0
        currency: ${STORE_CURRENCY}
    rules:
      - type: item_total_rule
        preferences:
          minimum_amount: 100

payment_methods:
  - name: Credit Card
    type: bogus
    description: Test payment gateway.
    storefront_visible: false
  - name: Check
    type: check
    description: Pay by check.
    storefront_visible: false

promotions:
  - name: Free Shipping
    code: FREESHIP
    actions:
      - type: free_shipping
