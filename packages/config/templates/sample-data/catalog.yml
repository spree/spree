# yaml-language-server: $schema=../../schemas/spree-config.json
#
# Sample data, step 2: what builds on the imported catalog. The product
# import creates the categories, so the links to them come after it.
version: 1

# A new product of the type gets its category suggested.
product_types:
  - name: Kitchen Appliance
    categories: [kitchen]
  - name: Air Treatment
    categories: [air-and-climate]
  - name: Garment Care
    categories: [garment-care]
  - name: Vacuum Cleaner
    categories: [floor-care]
  - name: Hair Styling
    categories: [personal-care]
  - name: Grooming
    categories: [personal-care]

collections:
  # Two that keep themselves up to date from a rule.
  - permalink: new-arrivals
    name: New Arrivals
    automatic: true
    rules_match_policy: all
    sort_order: available_on desc
    rules:
      # Days back the window reaches.
      - { type: available_on, value: "30", match_policy: is_equal_to }
  - permalink: on-sale
    name: On Sale
    automatic: true
    rules_match_policy: all
    sort_order: price asc
    rules:
      - { type: sale, value: "true", match_policy: is_equal_to }
  # Best selling is a sort, not a rule: a shelf the merchant curates, ordered
  # by what actually sells.
  - permalink: best-sellers
    name: Best Sellers
    sort_order: best_selling
    products:
      - automatic-espresso-machine
      - semi-automatic-espresso-machine
      - drip-coffee-maker
      - digital-air-fryer-4l
      - digital-air-fryer-6l
      - dual-basket-air-fryer
      - high-speed-blender
      - personal-blender
      - electric-kettle-1-7l
      - temperature-control-kettle
      - 2-slice-toaster
      - 4-slice-toaster
